name: daily-intel
# 时刻在线:每天定时跑,增量更新论文+配图并 commit,GitHub Pages 自动刷新

on:
  schedule:
    - cron: "0 1 * * *"   # 每天 UTC 01:00(北京 09:00)
  workflow_dispatch: {}    # 也支持手动触发

permissions:
  contents: write          # 允许 commit 回仓库

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml openai sentence-transformers PyMuPDF Pillow

      - name: Run daily pipeline
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        run: python daily.py

      - name: Commit results
        run: |
          git config user.name "robot-intel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "chore: daily intel update"
          git push
