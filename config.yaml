# ============================================================
#  robot-intel 配置 —— 系统的灵魂
#  改这里 = 调系统行为(每天整备 = 改配置,不改代码)
# ============================================================

# arXiv 抓取范围
arxiv:
  # cs.* = 具身智能;q-bio.NC/eess.SP = BCI;q-bio.BM/GN/QM = 蛋白质/基因/计算生物 AI
  categories: [cs.RO, cs.AI, cs.LG, cs.CV, cs.HC, q-bio.NC, eess.SP, q-bio.BM, q-bio.GN, q-bio.QM]
  max_results: 350          # 每次拉最近多少篇(再做相关度过滤)
  request_delay_sec: 5      # 礼貌间隔(官方建议≥3s,给到 5s 更稳)。生产每天只跑1次=1个请求,不会限流;
                            # 失败也不致命(HF 兜底)。别短时间反复手动跑,那才会触发 429 冷却。
  # 关键词驱动检索(强烈推荐):只在分类里搜命中这些词的最新论文,
  # 召回率远高于"拉巨型分类最近 N 篇"(后者大半是无关噪声)。留空则退回纯按分类拉。
  search_terms:
    - robot
    - manipulation
    - humanoid
    - vision-language-action
    - embodied
    - locomotion
    - dexterous
    - teleoperation
    - world model
    - sim-to-real
    - imitation learning
    - robot policy
    - robot learning
    # 脑机接口
    - brain-computer interface
    - brain-machine interface
    - neural decoding
    - EEG
    - neuroprosthetic
    - neural interface
    - speech neuroprosthesis
    - brain-controlled robot
    - ECoG decoding
    - neural foundation model
    - brain-spine interface
    # 蛋白质 / 基因 / 计算生物 AI
    - protein structure
    - protein design
    - protein language model
    - AlphaFold
    - genomics
    - DNA language model
    - gene editing
    - drug discovery
    - molecular generation
  # 兜底源:Hugging Face Daily Papers(社区精选 + 自带热度),并入主力结果一起过滤
  use_hf_daily: true

# ---------- 主力取数:OpenAlex 锁 arXiv 源 ----------
# arXiv 老 API(export.arxiv.org/api/query)从云 IP(GitHub Actions)几乎必 429,已退役。
# OpenAlex 是为轮询而生的开放目录,带 mailto 进礼貌池后实测无 429,
# 锁定 arXiv 源(S4306400194)拿到的就是 arXiv 预印本本身,且白送 abstract / 被引用数 / 机构。
openalex:
  enabled: true
  mailto: liangfenmmd@gmail.com  # 进礼貌池(polite pool),换成你的邮箱
  days: 7                        # 抓最近几天(run.py 按 seen 去重,宽窗无害=补漏过的天)
  per_page: 200                  # 每页(OpenAlex 上限 200)
  terms_per_query: 12            # 每次 OR 多少个 search_terms(避免 query 过长)
  max_pages: 2                   # 每批关键词最多翻几页
  # 多源:arXiv 主力 + bioRxiv 补冷门域(脑机/蛋白顶尖工作多在 Nature/bioRxiv,arXiv 覆盖不到)。
  # kind=arxiv 的 key 是 arXiv 号(能抓配图);kind=biorxiv 的 key 是 DOI(自动跳过抓图)。
  sources:
    - { id: S4306400194, kind: arxiv }     # arXiv(别改 id)
    - { id: S4306402567, kind: biorxiv }   # bioRxiv(脑机/蛋白冷门域)
    # - { id: S3005729997, kind: biorxiv } # medRxiv(要医学预印本再开)

# 过滤:从抓到的论文里,留多少进入贵的 LLM 拆解
filter:
  relevance_min: 0.12       # 相关度低于此直接丢(0~1,关键词后端的标度;关键词检索后已较干净,放宽)
  keep_top_k: 52            # 兜底:无论如何最多保留前 K 篇做 LLM 分析
  # 领域保底名额:防止具身论文数量碾压把冷门域挤出(见 run.py._select_with_floor)
  # 其余名额仍按全局相关度填,具身照样占多数;只是给 ai_science/bci 留个地板
  domain_floor:
    ai_science: 10
    bci: 8

# ---------- 评分(满分 100)----------
# 设计:base = 相关度 + 内容,驱动「今天该不该读」(read_priority)
#       bonus = 热度 + 质量,随时间增长(论文越老越准,系统每天重算)
#       total = base + bonus,驱动 S/A/B/C/D 评级
scoring:
  weights:
    relevance: 30           # 相关度(嵌入/关键词,客观计算)
    content: 30             # 内容拆解 = 新颖10 + 证据12 + 可复现8(LLM 给)
    heat: 20                # 热度(HF upvote / GitHub star / 社媒,客观)
    quality: 20             # 质量影响力(引用/venue/作者,来自 S2)
  grade_thresholds:         # 对 total
    S: 80
    A: 65
    B: 50
    C: 35
  priority_thresholds:      # 对 base(relevance+content,最高 60)—— 决定今天读不读
    A: 45
    B: 32
    C: 20

# ---------- LLM(拆解 + 主观打分)----------
llm:
  provider: qwen            # qwen | openai | anthropic | none(none = 跳过出占位)
  model: qwen-plus          # 拆解默认 qwen-plus;要更准换 qwen-max,代码版换 qwen3-coder-plus
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1  # DashScope OpenAI 兼容端点
  max_papers_per_run: 52    # 成本闸:每次最多 LLM 分析多少篇(对齐 keep_top_k)

# ---------- LLM 初筛(廉价模型批量判相关性 + 分路线)----------
# 三级漏斗中间层:免费锚点门 → 这里(qwen-turbo 批量初筛)→ 贵的 qwen-plus 深拆解。
# 标题就够判,40 篇/次,token 极省;比嵌入/关键词精度高得多(能识别"纯NLP"等域外)。
prefilter:
  enabled: true
  provider: qwen
  model: qwen-turbo         # 初筛用最便宜的;深拆解才用 qwen-plus
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  batch_size: 40
  max_candidates: 150       # 成本闸:最多送多少篇进初筛(锚点门后通常远小于此)
  # key 走环境变量(本地放 .env,CI 放 GitHub secret):
  #   qwen → QWEN_API_KEY / DASHSCOPE_API_KEY;anthropic → ANTHROPIC_API_KEY

# ---------- 横切标签(不是路线,是方法成分)----------
# 多模态融合放这里,而不是单独路线 —— 避免和 VLA/WM 大面积重叠
cross_cutting_tags:
  - multimodal-fusion
  - tactile
  - dexterous
  - sim2real
  - teleoperation
  - dataset
  - benchmark
  - open-source
  - real-robot
  - large-scale

# ============================================================
#  路线(relevance 过滤的锚点)
#  seed: 代表作,系统用它们的标题+关键词构建「兴趣画像」
#  arxiv_id 是 best-effort 占位,⚠️ 用前自己核一下;
#  当前相关度只用 title+keywords,所以 ID 错也不影响过滤
# ============================================================
routes:
  # ---------- 🟥 核心(高权重,单独子图)----------
  - id: vla
    name: VLA (Vision-Language-Action)
    tier: core
    weight: 1.0
    enabled: true
    keywords: [vision-language-action, VLA, generalist policy, robot foundation model,
               language-conditioned, action model, visuomotor, action chunking, robot transformer]
    seeds:
      - { title: "RT-2: Vision-Language-Action Models Transfer Web Knowledge to Robotic Control", arxiv_id: "2307.15818" }
      - { title: "OpenVLA: An Open-Source Vision-Language-Action Model", arxiv_id: "2406.09246" }
      - { title: "pi0: A Vision-Language-Action Flow Model for General Robot Control", arxiv_id: "2410.24164" }
      - { title: "Octo: An Open-Source Generalist Robot Policy", arxiv_id: "2405.12213" }
      - { title: "RDT-1B: a Diffusion Foundation Model for Bimanual Manipulation", arxiv_id: "2410.07864" }
      - { title: "GR00T N1: An Open Foundation Model for Generalist Humanoid Robots", arxiv_id: "2503.14734" }

  - id: world_model
    name: World Model / WAM
    tier: core
    weight: 1.0
    enabled: true
    keywords: [world model, world action model, video prediction, latent dynamics,
               model-based RL, generative environment, dreaming, physical AI, video generation]
    seeds:
      - { title: "Mastering Diverse Domains through World Models (DreamerV3)", arxiv_id: "2301.04104" }
      - { title: "Genie: Generative Interactive Environments", arxiv_id: "2402.15391" }
      - { title: "Cosmos World Foundation Model Platform for Physical AI", arxiv_id: "2501.03575" }
      - { title: "DayDreamer: World Models for Physical Robot Learning", arxiv_id: "2206.14176" }
      - { title: "Navigation World Models", arxiv_id: "2412.03572" }

  - id: whole_body_control
    name: Whole-body Control / Locomotion
    tier: core
    weight: 1.0
    enabled: true
    keywords: [whole-body control, humanoid locomotion, legged locomotion, bipedal,
               teleoperation, motion imitation, sim-to-real, RL controller, balance, fall recovery]
    seeds:
      - { title: "Expressive Whole-Body Control for Humanoid Robots (ExBody)", arxiv_id: "2402.16796" }
      - { title: "HumanPlus: Humanoid Shadowing and Imitation from Humans", arxiv_id: "2406.10454" }
      - { title: "H2O: Learning Human-to-Humanoid Real-Time Whole-Body Teleoperation", arxiv_id: "2403.04436" }
      - { title: "OmniH2O: Universal and Dexterous Human-to-Humanoid Whole-Body Teleoperation", arxiv_id: "2406.08858" }
      - { title: "Humanoid Locomotion as Next Token Prediction", arxiv_id: "2402.19469" }

  # ---------- 🟧 次要(降权,跟踪,喂养核心)----------
  - id: dexterous_manipulation
    name: Dexterous Manipulation
    tier: secondary
    weight: 0.6
    enabled: true
    keywords: [dexterous manipulation, dexterous hand, multi-finger, in-hand manipulation,
               bimanual, grasping, tactile, ALOHA]
    seeds:
      - { title: "Learning Fine-Grained Bimanual Manipulation with Low-Cost Hardware (ALOHA/ACT)", arxiv_id: "2304.13705" }
      - { title: "DexCap: Scalable and Portable Mocap Data Collection for Dexterous Manipulation", arxiv_id: "2403.07788" }
      - { title: "DexMimicGen: Automated Data Generation for Bimanual Dexterous Manipulation", arxiv_id: "2410.24185" }

  - id: sim2real_data
    name: Sim2Real / Data / Simulation
    tier: secondary
    weight: 0.6
