<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>情报台 · 具身/脑机/AI科学</title>
<script src="https://unpkg.com/force-graph@1"></script>
<style>
  :root{
    --bg:#0a0a0c; --panel:#101013; --card:#15151a; --card2:#1a1a20; --line:#24242b; --line2:#33333c;
    --fg:#ededee; --mut:#82828b; --mut2:#b2b2ba; --accent:#6e9bd6;
    --gold:#d6a84a; --heavy:#e0894a; --notable:#d6a84a;
    --S:#e05568; --A:#d8923f; --B:#5b8bb0; --C:#5fae6f; --D:#5a5a61;
    --rel:#7d8fb0; --con:#9a8db0; --heat:#bd8a6a; --qual:#6fae8c;
  }
  *{box-sizing:border-box;}
  body{margin:0; font:13.5px/1.55 -apple-system,Segoe UI,Roboto,"PingFang SC",sans-serif;
       background:var(--bg); color:var(--fg); height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;}
  .mut{color:var(--mut);} .grow{flex:1;}
  button{font:inherit; cursor:pointer; color:inherit;}
  ::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:#2a2a32;border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ===== 顶栏:领域选择 ===== */
  .top{display:flex; align-items:center; gap:10px 18px; padding:10px 18px; border-bottom:1px solid var(--line);
       flex-wrap:wrap;}
  .brand{font-size:14.5px; font-weight:650; white-space:nowrap; letter-spacing:.01em;}
  .brand span{color:var(--mut); font-weight:400; font-size:11.5px;}
  /* 主导航:5 个目的标签(单轴) */
  .tabs{display:flex; gap:4px; flex-wrap:wrap;}
  .tabs button{padding:7px 16px; border:1px solid transparent; background:none; color:var(--mut);
               border-radius:9px; font-size:13.5px; font-weight:550; transition:.12s;}
  .tabs button:hover{color:var(--fg); background:var(--card);}
  .tabs button.on{background:var(--card2); color:var(--fg); border-color:var(--line2); font-weight:650;}
  .stat{font-size:11.5px; color:var(--mut);}
  /* 动态板块卡片 */
  .feed{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:6px;}
  .fitem{display:block; padding:8px 11px; background:var(--card); border:1px solid var(--line);
         border-radius:9px; text-decoration:none; transition:.12s;}
  .fitem:hover{border-color:var(--line2); background:var(--card2);}
  .fitem .ft{display:block; font-size:12.5px; color:var(--fg); line-height:1.4;}
  .fitem .fs{display:block; font-size:10.5px; color:var(--mut); margin-top:3px;}
  .ngroup{margin-bottom:18px;}
  .ngroup h3{font-size:13.5px; margin:0 0 9px; display:flex; align-items:center; gap:7px;}
  /* 今日要闻:独立面板带,与下方"代表玩家"清晰分区 */
  .feedband{grid-column:1/-1; background:var(--panel); border:1px solid var(--line);
            border-radius:13px; padding:14px 16px 15px; margin-bottom:8px;}
  .feedband h3{margin:0 0 11px;}
  .feed{gap:7px;}
  /* 分节分隔:代表玩家 · 实力横评 */
  .secdiv{grid-column:1/-1; display:flex; align-items:center; gap:12px; margin:20px 2px 16px;}
  .secdiv .st{font-size:12px; font-weight:650; color:var(--mut2); white-space:nowrap; letter-spacing:.02em;}
  .secdiv .sub{font-size:11px; color:var(--mut); white-space:nowrap;}
  .secdiv::after{content:""; flex:1; height:1px; background:var(--line);}
  .ncard{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:14px 15px;}
  .ncard .nh{display:flex; align-items:baseline; gap:8px; margin-bottom:7px;}
  .ncard .nm{font-size:14px; font-weight:650;}
  .ncard .sc{margin-left:auto; font-weight:750; font-variant-numeric:tabular-nums;}
  .ncard .st{font-size:10.5px; padding:1px 7px; border-radius:5px; border:1px solid var(--line2); color:var(--mut2);}
  .ncard{cursor:pointer; transition:.12s;}
  .ncard:hover{border-color:var(--line2); background:var(--card2);}
  .ncard .pos{font-size:12px; color:var(--mut2); margin-bottom:8px;}
  .sxg{display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; margin:2px 0 10px;}
  .sxg.big{grid-template-columns:1fr; gap:6px;}
  .sx{display:flex; align-items:center; gap:6px;}
  .sx .sl{font-size:10.5px; color:var(--mut); min-width:30px; white-space:nowrap;}
  .sx .sb{flex:1; height:5px; background:var(--line); border-radius:3px; overflow:hidden;}
  .sx .sb i{display:block; height:100%;}
  .pchips{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:7px;}
  .pchip{font-size:10.5px; padding:1px 7px; border:1px solid var(--line2); border-radius:5px; color:var(--mut2); background:var(--card2);}
  .dyn{margin:0; padding-left:15px; font-size:11.5px; color:var(--mut); line-height:1.55;}
  .dyn.big{font-size:12.5px; color:var(--mut2); line-height:1.7;}
  .ncard .st{font-size:10.5px; padding:1px 7px; border-radius:5px; border:1px solid var(--line2); color:var(--mut2);}
  .ncard .lt{font-size:12.5px; color:var(--mut2); line-height:1.5; margin:3px 0;}
  .ncard .fund{font-size:12px; color:var(--gold);}
  .ncard .hl{font-size:11.5px; color:var(--mut); margin-top:3px; line-height:1.45;}
  .help-btn{border:1px solid var(--line); background:var(--panel); color:var(--mut); border-radius:7px; padding:5px 11px; font-size:12px;}
  .help-btn:hover{border-color:var(--line2); color:var(--fg);}

  /* ===== 筛选/排序条 ===== */
  .subbar{display:flex; align-items:center; gap:8px 16px; padding:8px 18px; border-bottom:1px solid var(--line);
          background:var(--panel); flex-wrap:wrap;}
  .grp{display:flex; align-items:center; gap:6px;}
  .grp>span.lb{font-size:10.5px; color:var(--mut); letter-spacing:.04em;}
  .grp.search{min-width:min(340px,100%);}
  .searchbox{display:flex; align-items:center; gap:6px; width:100%; min-width:220px; padding:4px 9px;
             border:1px solid var(--line); border-radius:8px; background:var(--card); transition:.12s;}
  .searchbox:focus-within{border-color:#626276; background:var(--card2);}
  .searchbox span{font-size:11px; color:var(--mut);}
  .searchbox input{width:100%; min-width:0; border:0; outline:0; background:transparent; color:var(--fg);
                   font:inherit; font-size:12.5px;}
  .searchbox input::placeholder{color:#666670;}
  .chip{padding:3px 10px; border:1px solid var(--line); border-radius:14px; background:transparent;
        font-size:12px; color:var(--mut2); white-space:nowrap; transition:.12s;}
  .chip:hover{border-color:var(--line2); color:#fff;}
  .chip.on{background:#262630; border-color:#79798a; color:#fff;}
  select{background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:7px; padding:4px 8px; font-size:12.5px;}

  /* ===== 主体:单列 ===== */
  .body{flex:1; min-height:0; display:block;}
  .col{min-height:0; height:100%; overflow:auto; padding:16px 20px;}
  .col h2.coltitle{font-size:11px; color:var(--mut); text-transform:uppercase; letter-spacing:.07em;
                   margin:0 0 13px; font-weight:600;}
  /* 折叠的评分细节(详情抽屉底部) */
  .scoredetail summary{cursor:pointer; font-size:11.5px; color:var(--mut); list-style:none; padding:4px 0;
                       border-top:1px solid var(--line); margin-top:14px;}
  .scoredetail summary:hover{color:var(--fg);}
  .scoredetail summary::-webkit-details-marker{display:none;}
  .scoredetail summary::before{content:"▸ "; }
  .scoredetail[open] summary::before{content:"▾ "; }

  /* #list 是块容器;只有论文/玩家网格(.list)才是栅格 */
  #list{display:block;}
  .list{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));
        gap:13px; align-items:start;}
  .pcard{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:12px 14px;
         cursor:pointer; transition:.12s; position:relative; overflow:hidden;}
  .pcard:hover{border-color:var(--line2); background:var(--card2);}
  .pcard.sel{border-color:var(--accent);}
  /* 图按自身宽高比走,不裁不拉;只给 max-height 兜住极端竖图 */
  .pthumb{width:calc(100% + 28px); margin:-12px -14px 11px; height:auto; max-height:230px;
          object-fit:contain; display:block; background:#fff;
          border-radius:11px 11px 0 0; border-bottom:1px solid var(--line);}
  .pcard .row1{display:flex; align-items:center; gap:7px; margin-bottom:7px;}
  .sig{display:inline-flex; align-items:baseline; gap:3px; font-weight:700; font-variant-numeric:tabular-nums;}
  .sig b{font-size:18px; line-height:1;} .sig small{font-size:10px; color:var(--mut); font-weight:500;}
  .tierdot{width:7px;height:7px;border-radius:50%; display:inline-block;}
  .flag{font-size:12px;}
  .org{padding:1px 7px; border-radius:5px; font-size:11px; background:var(--card2); color:var(--mut2);
       border:1px solid var(--line2); white-space:nowrap;}
  .otype{font-size:10px; color:var(--mut); border:1px solid var(--line); border-radius:4px; padding:0 5px;}
  .pcard h3{margin:0 0 5px; font-size:13.5px; font-weight:600; line-height:1.4;}
  .venue{display:inline-block; font-size:10.5px; font-weight:600; color:var(--gold);
         background:rgba(214,168,74,.1); border:1px solid rgba(214,168,74,.32);
         border-radius:5px; padding:1px 7px; margin:0 0 6px;}
  .pcard .tldr{font-size:12px; color:var(--mut2); line-height:1.5;}
  .pcard .foot{display:flex; gap:9px; align-items:center; margin-top:8px; font-size:11px; color:var(--mut); flex-wrap:wrap;}
  .badge{padding:1px 6px; border-radius:5px; font-size:10.5px; font-weight:700; color:#0a0a0c;}


  /* ===== 首页精选:本周具身 Top15 + 今日精选 ===== */
  .featwrap{max-width:1200px; margin:0 auto;}
  .feat{margin-bottom:30px;}
  /* 周报 hero 头 */
  .feat-h{display:flex; align-items:center; gap:10px 13px; margin:0 0 16px; padding-bottom:13px;
          border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .feat-h .ic{font-size:22px; line-height:1;}
  .feat-h .ttl{font-size:20px; font-weight:800; letter-spacing:.01em;}
  .feat-h .wkrange{font-size:12.5px; color:var(--gold); font-weight:700; font-variant-numeric:tabular-nums;
        background:rgba(214,168,74,.12); border:1px solid rgba(214,168,74,.34); border-radius:20px; padding:3px 12px;}
  .feat-h .sub{font-size:12px; color:var(--mut);}
  .feat-h .more{margin-left:auto; font-size:12px; color:var(--mut); cursor:pointer;
        border:1px solid var(--line2); border-radius:8px; padding:5px 13px; transition:.12s;}
  .feat-h .more:hover{color:var(--fg); border-color:var(--accent); background:var(--card);}
  /* Top15:两列卡片 */
  .wkgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(500px,100%),1fr)); gap:9px 16px;}
  .wkitem{display:flex; align-items:center; gap:13px; padding:11px 14px; border-radius:11px; cursor:pointer;
          background:var(--card); border:1px solid var(--line); transition:.13s; min-width:0; overflow:hidden;}
  .wkitem:hover{border-color:var(--line2); background:var(--card2); transform:translateY(-1px);}
  .wkitem .wr{font-size:15px; font-weight:800; color:var(--gold); width:26px; flex:none; text-align:center;
              font-variant-numeric:tabular-nums;}
  .wkitem .wsig{display:flex; flex-direction:column; align-items:center; width:34px; flex:none; line-height:1;}
  .wkitem .wsig b{font-size:17px; font-weight:800; font-variant-numeric:tabular-nums;}
  .wkitem .wsig small{font-size:8.5px; color:var(--mut); margin-top:2px;}
  .wkitem .wmid{flex:1; min-width:0;}
  .wkitem .wtt{font-size:13.5px; font-weight:550; line-height:1.4; color:var(--fg);
               overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .wkitem .wsub{font-size:11px; color:var(--mut); margin-top:3px; display:flex; gap:7px; align-items:center;}
  .wkitem .wv{flex:none; font-size:10.5px; font-weight:650; color:var(--gold); background:rgba(214,168,74,.13);
              border:1px solid rgba(214,168,74,.32); border-radius:6px; padding:2px 8px; white-space:nowrap;}
  /* 今日精选:卡片 */
  .pkgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr)); gap:13px;}
  .pkc{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:14px 16px;
       cursor:pointer; transition:.13s; border-left:3px solid var(--line2);}
  .pkc:hover{border-color:var(--line2); background:var(--card2); transform:translateY(-1px);}
  .pkc .pkm{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:11px; color:var(--mut);}
  .pkc .pkm b{font-size:16px; font-weight:800; font-variant-numeric:tabular-nums;}
  .pkc .pkhk{font-size:14px; font-weight:680; line-height:1.45; color:var(--fg);
             display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .pkc .pkvd{font-size:11.5px; color:var(--mut2); line-height:1.55; margin-top:7px;
             display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  @media(max-width:760px){ .wkgrid{grid-template-columns:1fr;} }

  /* 领域进展卡片(全景域页 dashgrid 内)*/
  .dcard{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:12px 13px; margin-bottom:10px;}
  .dcard .dh{display:flex; align-items:baseline; gap:8px; margin-bottom:8px;}
  .dcard .dh .nm{font-size:13.5px; font-weight:650; cursor:pointer;}
  .dcard .dh .nm:hover{color:var(--accent);}
  .dcard .dh .ct{margin-left:auto; font-size:11px; color:var(--mut); white-space:nowrap;}
  .pk{color:var(--gold);}
  .ctry{display:flex; gap:6px; margin:5px 0; font-size:12px; align-items:baseline;}
  .ctry .cf{white-space:nowrap;}
  .ctry .pl{color:var(--mut2); line-height:1.5;}
  .verdict{font-size:11.5px; color:var(--mut2); margin-top:9px; padding-top:8px; border-top:1px solid var(--line);
           line-height:1.5;}
  .verdict b{color:var(--gold); font-weight:600;}
  .activity{font-size:11px; color:var(--mut); margin-bottom:7px; line-height:1.45;}
  .works{display:flex; flex-direction:column; gap:1px;}
  .wk{display:flex; align-items:center; gap:7px; padding:2px 4px; border-radius:5px; font-size:12px; cursor:default;}
  .wk:hover{background:var(--card2);}
  .wk .ws{font-weight:700; font-variant-numeric:tabular-nums; min-width:22px; text-align:right; font-size:12.5px;}
  .wk .wn{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--fg);}
  .wk .wf{font-size:11px;} .wk .wo{font-size:10.5px; color:var(--mut); white-space:nowrap; max-width:96px; overflow:hidden; text-overflow:ellipsis;}
  .wmore{font-size:11px; color:var(--mut); padding:3px 4px 0; cursor:pointer;}
  .wmore:hover{color:var(--accent);}

  /* ===== 全景视图(跨领域着陆页)===== */
  .ovwrap{max-width:1180px; margin:0 auto;}
  /* 行业定调 hero */
  .ovhero{margin:2px 0 22px;}
  .ovhero-t{font-size:11px; color:var(--mut); text-transform:uppercase; letter-spacing:.08em; margin:0 0 10px; font-weight:600;}
  .ovhero-g{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:11px;}
  .hcard{position:relative; background:linear-gradient(150deg,#16131a,#121216 60%); border:1px solid #34303c;
         border-radius:13px; padding:15px 17px; cursor:pointer; transition:.13s; overflow:hidden;}
  .hcard:hover{border-color:#4a4452; transform:translateY(-1px);}
  .hcard .rank{position:absolute; top:10px; right:13px; font-size:11px; font-weight:700; color:var(--gold); opacity:.85;}
  .hcard .hsig{display:flex; align-items:baseline; gap:4px; margin-bottom:6px;}
  .hcard .hsig b{font-size:25px; line-height:1; font-weight:780; font-variant-numeric:tabular-nums;}
  .hcard .hsig small{font-size:10px; color:var(--mut);}
  .hcard .htt{font-size:13.5px; font-weight:600; line-height:1.42; margin-bottom:6px;}
  .hcard .hmeta{font-size:11px; color:var(--mut); display:flex; gap:7px; align-items:center; flex-wrap:wrap;}
  .hcard .hdom{padding:1px 7px; border:1px solid var(--line2); border-radius:5px; color:var(--mut2);}
  /* 领域卡网格 */
  .ovgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:13px;}
  .ovcard{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:15px 16px; display:flex; flex-direction:column;}
  .ovcard .ovh{display:flex; align-items:center; gap:9px; margin-bottom:3px;}
  .ovcard .ovname{font-size:15px; font-weight:680; cursor:pointer;}
  .ovcard .ovname:hover{color:var(--accent);}
  .ovbadge{font-size:11px; font-weight:650; padding:2px 9px; border-radius:20px; white-space:nowrap;}
  .bk-heavy{background:rgba(224,137,74,.16); color:var(--heavy); border:1px solid rgba(224,137,74,.4);}
  .bk-notable{background:rgba(214,168,74,.14); color:var(--notable); border:1px solid rgba(214,168,74,.35);}
  .bk-worth{background:rgba(111,154,140,.13); color:#7fa898; border:1px solid rgba(111,154,140,.3);}
  .bk-calm{background:var(--card2); color:var(--mut); border:1px solid var(--line2);}
  .ovcard .ovmeta{font-size:11px; color:var(--mut); margin-bottom:12px; font-variant-numeric:tabular-nums;}
  .ovsec{font-size:10px; color:var(--mut); text-transform:uppercase; letter-spacing:.05em; margin:0 0 6px;}
  .ovanchor{display:flex; gap:10px; align-items:flex-start; padding:10px 11px; background:var(--card2);
            border:1px solid var(--line); border-radius:10px; cursor:pointer; margin-bottom:11px; transition:.12s;}
  .ovanchor:hover{border-color:var(--line2);}
  .ovanchor .as{font-size:20px; font-weight:780; line-height:1; font-variant-numeric:tabular-nums; min-width:30px;}
  .ovanchor .at{font-size:12.5px; font-weight:600; line-height:1.4;}
  .ovanchor .am{font-size:10.5px; color:var(--mut); margin-top:3px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .ovrecent{display:flex; flex-direction:column; gap:1px; margin-bottom:11px;}
  .ovrow{display:flex; align-items:center; gap:8px; padding:4px 5px; border-radius:6px; cursor:pointer; font-size:12px;}
  .ovrow:hover{background:var(--card2);}
  .ovrow .rs{font-weight:700; font-variant-numeric:tabular-nums; min-width:23px; text-align:right;}
  .ovrow .rt{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--mut2);}
  .ovrow .rf{font-size:11px;}
  .ovempty{font-size:11.5px; color:var(--mut); padding:7px 5px;}

  /* 抽屉 */
  #drawer{position:fixed; top:0; right:0; width:min(500px,94vw); height:100vh; height:100dvh; background:#0c0c10;
          border-left:1px solid var(--line2); padding:22px 24px calc(40px + env(safe-area-inset-bottom));
          overflow:auto; -webkit-overflow-scrolling:touch; transform:translateX(100%);
          transition:transform .22s; box-shadow:-16px 0 50px rgba(0,0,0,.55); z-index:30;}
  #drawer.open{transform:translateX(0);}
  #drawer .close{position:absolute; top:15px; right:17px; color:var(--mut); font-size:21px; cursor:pointer;}
  #drawer h2{font-size:16.5px; margin:0 20px 8px 0; line-height:1.45;}
  .sigbig{display:flex; align-items:center; gap:12px; margin:12px 0; padding:12px; background:var(--card);
          border:1px solid var(--line); border-radius:10px;}
  .sigbig .n{font-size:30px; font-weight:750; line-height:1;}
  .sigbig .x{font-size:11.5px; color:var(--mut2); line-height:1.4;}
  .kv{display:grid; grid-template-columns:78px 1fr; gap:5px 10px; margin:12px 0; font-size:13px;}
  .kv dt{color:var(--mut);} .kv dd{margin:0;}
  .sgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin:12px 0; text-align:center;}
  .sgrid div{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:7px 3px;}
  .sgrid b{display:block; font-size:17px;} .sgrid span{font-size:10.5px; color:var(--mut);}
  .section-t{font-size:10.5px; color:var(--mut); text-transform:uppercase; letter-spacing:.05em; margin:15px 0 5px;}
  .tag{display:inline-block; padding:0 6px; border:1px solid var(--line); border-radius:5px; font-size:11px; color:var(--mut); margin:1px 3px 1px 0;}
  a.btn{display:inline-block; margin:8px 6px 0 0; padding:6px 13px; background:#212128; color:var(--fg);
        border:1px solid var(--line2); border-radius:7px; text-decoration:none; font-size:12.5px;}
  a.btn:hover{border-color:#6a6a72;}
  #scrim{position:fixed; inset:0; background:rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:.22s; z-index:29;}
  #scrim.on{opacity:1; pointer-events:auto;}
  #legend{position:fixed; top:50px; right:18px; width:min(430px,90vw); background:#0e0e13; border:1px solid var(--line2);
          border-radius:11px; padding:16px 18px; z-index:25; display:none; box-shadow:0 14px 44px rgba(0,0,0,.55); font-size:12.5px;}
  #legend.open{display:block;}
  #legend h4{margin:12px 0 5px; font-size:10.5px; color:var(--mut); text-transform:uppercase;} #legend h4:first-child{margin-top:0;}
  #legend p{margin:3px 0; color:var(--mut2);}

  .empty{color:var(--mut); padding:30px 10px; text-align:center; font-size:13px;}
  .empty button{margin-top:10px;}
  .clear-btn{border:1px solid var(--line); background:var(--card); color:var(--mut2); border-radius:7px;
             padding:4px 9px; font-size:12px;}
  .clear-btn:hover{border-color:var(--line2); color:var(--fg);}
  /* 全景:全行业总览 + 单域深度页 */
  .ovhint{font-size:11.5px; margin:0 0 14px; text-align:center;}
  .panowrap{max-width:1180px; margin:0 auto;}
  .psec{margin-bottom:26px;}
  .psec>h3{font-size:14px; font-weight:680; margin:0 0 12px; display:flex; align-items:baseline; gap:9px;}
  .psec>h3 .mut{font-size:11px; font-weight:400;}
  .dashgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr)); gap:11px;}
  .secbody{font-size:13.5px; line-height:1.7; color:var(--fg);}
  @media (max-width:900px){
    .tabs{width:100%; overflow-x:auto; flex-wrap:nowrap; padding-bottom:2px;}
    .tabs button{flex:0 0 auto;}
    .grp.search{width:100%;}
    .searchbox{min-width:0;}
    .list{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));}
    .wkgrid{grid-template-columns:1fr;}
    .dashgrid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="top">
  <span class="brand">🛰️ 情报台 <span>具身·脑机·AI科学</span></span>
  <div class="tabs" id="tabs">
    <button data-m="home" class="on">🏠 首页</button><button data-m="papers">📄 论文库</button><button data-m="panorama">🌐 全景</button><button data-m="news">📰 动态</button><button data-m="graph">🕸 图谱</button>
  </div>
  <span class="grow"></span>
  <span class="stat" id="stat">加载中…</span>
  <button class="help-btn" id="helpBtn">❔</button>
</div>

<div class="subbar" id="subbar">
  <div class="grp" id="domGrp"><span class="lb">领域</span><span id="domChips" style="display:flex;gap:6px;flex-wrap:wrap"></span></div>
  <div class="grp paperonly" id="routeGrp"><span class="lb">细分</span><span id="routeChips" style="display:flex;gap:6px;flex-wrap:wrap"></span></div>
  <div class="grp search paperonly"><span class="lb">搜索</span>
    <label class="searchbox"><span>⌕</span><input id="fQuery" type="search" placeholder="标题 / 机构 / 标签 / 摘要"></label></div>
  <span class="grow"></span>
  <div class="grp paperonly"><span class="lb">时间</span>
    <select id="fTime"><option value="0">全部</option><option value="7">近7天</option>
      <option value="30">近30天</option><option value="90">近90天</option></select></div>
  <div class="grp paperonly"><span class="lb">国家</span>
    <select id="fCountry"><option value="">全部</option></select></div>
  <div class="grp paperonly"><span class="lb">机构</span>
    <select id="fOrgType"><option value="">全部</option><option value="company">企业</option>
      <option value="university">高校</option><option value="institute">研究机构</option></select></div>
  <div class="grp paperonly"><span class="lb">排序</span>
    <select id="fSort"><option value="significance">分量</option><option value="base">今日优先</option>
      <option value="total">总分</option><option value="heat">热度</option><option value="date">最新</option></select></div>
  <button class="clear-btn paperonly" id="clearFilters" style="display:none">清空筛选</button>
</div>

<div class="body">
  <div class="col left">
    <h2 class="coltitle" id="leftTitle">首页</h2>
    <div id="list"></div>
  </div>
</div>

<div id="scrim"></div>
<aside id="drawer"></aside>
<div id="legend"></div>

<script>
const GRADE={S:'#e05568',A:'#d8923f',B:'#5b8bb0',C:'#5fae6f',D:'#5a5a61'};
const DOMAINS={embodied_ai:'具身智能', bci:'脑机接口', ai_science:'AI×科学/生物', llm_base:'LLM基模'};
const CO={US:'🇺🇸',CN:'🇨🇳',JP:'🇯🇵',EU:'🇪🇺',UK:'🇬🇧',KR:'🇰🇷',Other:'🏳️'};
const CONAME={US:'美国',CN:'中国',JP:'日本',EU:'欧洲',UK:'英国',KR:'韩国'};
const OTYPE={company:'企业',university:'高校',institute:'研究机构',mixed:'产学研'};
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const orgOf=p=>{const o=(p.org||'').trim();return(!o||/^(unknown|未知|n\/a|none)$/i.test(o))?'':o;};
const coOf=p=>{const c=(p.country||'').trim().toUpperCase();return CO[c]?c:'';};
const tierColor=t=>t==='heavy'?'#e0894a':t==='notable'?'#d6a84a':t==='worth'?'#6f9a8c':'#3a3a42';

let DATA={papers:[],routes:[]}, PROGRESS={topics:{}}, LLMB=null;
let curDomain='embodied_ai';
let F={route:null};

let DYN=[], AXES={}, LOAD_ISSUES=[];
function loadJson(name){
  return fetch(name+'?_='+Date.now()).then(r=>{
    if(!r.ok) throw new Error(r.status+' '+r.statusText);
    return r.json();
  }).catch(err=>{
    LOAD_ISSUES.push(`${name}: ${err.message||err}`);
    return null;
  });
}
Promise.all([
  loadJson('data.json'),
  loadJson('progress.json'),
  loadJson('llm_base.json'),
  loadJson('dynamics.json'),
  loadJson('graph.json'),
  loadJson('news.json'),
  loadJson('daily_picks.json'),
  loadJson('weekly_picks.json'),
]).then(([d,pg,lb,dy,gr,nw,pk,wk])=>{
  if(d)DATA=d; if(pg)PROGRESS=pg; if(lb)LLMB=lb;
  if(dy){ DYN=dy.companies||[]; AXES=dy.axes||{}; }
  if(gr)GRAPH=gr; if(nw)NEWS=nw.news||[];
  if(pk)PICKS=pk;
  if(wk)WEEKLY=wk;
  init();
});
let GRAPH={nodes:[],links:[]}, KG=null, NEWS=[];
let PICKS={picks_by_date:{},latest:''};
let WEEKLY={picks:[],week:{}}, weeklyExpanded=false;
let mode='home';
// 各标签允许的领域(领域降为二级筛选器)
const TAB_DOMAINS={
  papers:['embodied_ai','bci','ai_science'],
  panorama:['all','embodied_ai','bci','ai_science','llm_base'],
  news:['embodied_ai','bci','ai_science','llm_base'],
  graph:['embodied_ai','bci','ai_science'],
};

function init(){
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  // 国家下拉
  const cset=[...new Set(DATA.papers.map(coOf).filter(Boolean))];
  const fc=document.getElementById('fCountry');
  cset.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=CONAME[c]||c;fc.appendChild(o);});
  ['fTime','fCountry','fOrgType','fSort'].forEach(id=>document.getElementById(id).onchange=renderList);
  document.getElementById('fQuery').oninput=renderList;
  document.getElementById('clearFilters').onclick=resetFilters;
  document.getElementById('helpBtn').onclick=()=>document.getElementById('legend').classList.toggle('open');
  document.getElementById('scrim').onclick=closeDrawer;
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();document.getElementById('legend').classList.remove('open');}});
  document.getElementById('legend').innerHTML=`
    <h4>分量分 (significance 0-100)</h4>
    <p>挑剔的真实价值分,<b>忽略作者自吹</b>。90+里程碑·75+重磅·60+显著·45+值得看。默认按它排序——重磅论文持续霸榜,直到更重的出现。</p>
    <h4>五个标签</h4><p>🏠首页=本周具身Top15+今日精选;📄论文库=全部论文+筛选;🌐全景=领域进展+代表玩家;📰动态=要闻;🕸图谱=关系网。领域是二级筛选器。</p>
    <h4>论文分数</h4><p>今日优先(base/60)=该不该今天读;总分(/100)含热度质量,随时间长。</p>`;
  const hm=(location.hash||'').replace('#','');
  if(['home','papers','panorama','news','graph'].includes(hm)) mode=hm;
  if(mode==='panorama') curDomain='all';   // 直链 #panorama 也落「全行业」
  syncDom();
}

function syncDom(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
  try{ location.hash=mode; }catch(e){}
  // 领域合法性:切到不支持当前域的标签时回落到该标签首个域
  const doms=TAB_DOMAINS[mode]||[];
  if(mode!=='home' && doms.length && !doms.includes(curDomain)) curDomain=doms[0];

  // 二级条:首页隐藏;论文标签显示全部筛选,其它只显示领域 chips
  document.getElementById('subbar').style.display=(mode==='home')?'none':'';
  document.querySelectorAll('.paperonly').forEach(el=>el.style.display=(mode==='papers')?'':'none');
  buildDomChips(doms);
  if(mode==='papers') buildRouteChips();

  // 标题
  const T={home:'首页 · 本周具身Top15 / 今日精选', papers:'论文库', panorama:'全景', news:'动态', graph:'图谱'};
  let title=T[mode]||'';
  if(mode==='panorama'||mode==='news'||mode==='graph') title+=' · '+(curDomain==='all'?'全行业':DOMAINS[curDomain]);
  document.getElementById('leftTitle').textContent=title;

  if(mode==='home') renderHome();
  else if(mode==='papers') renderList();
  else if(mode==='panorama') renderPanorama();
  else if(mode==='news') renderNews();
  else if(mode==='graph') renderGraph();
}

function buildDomChips(doms){
  const grp=document.getElementById('domGrp');
  grp.style.display=(mode==='home'||!doms.length)?'none':'';
  const dc=document.getElementById('domChips'); dc.innerHTML='';
  doms.forEach(dom=>{
    const c=document.createElement('button'); c.className='chip'+(curDomain===dom?' on':'');
    c.textContent=(dom==='all')?'🌐 全行业':DOMAINS[dom];
    c.onclick=()=>{ curDomain=dom; F.route=null; syncDom(); };
    dc.appendChild(c);
  });
}
function buildRouteChips(){
  const rc=document.getElementById('routeChips'); rc.innerHTML='';
  const routes=DATA.routes.filter(r=>(r.domain||'embodied_ai')===curDomain && r.count>0);
  if(!routes.length){ rc.innerHTML='<span class="mut" style="font-size:11.5px">—</span>'; return; }
  routes.forEach(r=>{
    const c=document.createElement('button'); c.className='chip'+(F.route===r.id?' on':'');
    c.textContent=`${r.name} ${r.count}`;
    c.onclick=()=>{F.route=F.route===r.id?null:r.id; syncDom();};
    rc.appendChild(c);
  });
}

function setMode(m){
  if(m==='panorama') curDomain='all';   // 点全景标签默认落「全行业」总览
  mode=m; syncDom(); document.querySelector('.col.left').scrollTop=0;
}
window.setMode=setMode;

const CDOMAIN_MAP={embodied_ai:'embodied', bci:'bci', llm_base:'llm'};
function curCompanies(){
  const cd=CDOMAIN_MAP[curDomain];
  return DYN.filter(c=>c.domain===cd).sort((a,b)=>(b.overall||0)-(a.overall||0));
}
function newsFeed(){
  const cd=CDOMAIN_MAP[curDomain];
  const ns=NEWS.filter(n=>n.domain===cd).slice(0,12);
  if(!ns.length) return '';
  return `<div class="feedband"><h3>📰 今日要闻 <span class="mut" style="font-size:11px">RSS·每日 · ${ns.length} 条</span></h3>
    <div class="feed">${ns.map(n=>`<a class="fitem" href="${esc(n.link)}" target="_blank">
      <span class="ft">${esc(n.title)}</span><span class="fs">${esc(n.source||'')} · ${esc((n.date||'').slice(0,11))}</span></a>`).join('')}</div></div>`;
}
function renderNews(){
  const list=document.getElementById('list');
  const feed=newsFeed();
  const cd=CDOMAIN_MAP[curDomain];
  const ncount=NEWS.filter(n=>n.domain===cd).length;
  document.getElementById('stat').textContent=`${DOMAINS[curDomain]} · 动态 · ${ncount} 条`;
  list.innerHTML=feed||`<div class="empty">该领域今日暂无要闻。<br><span class="mut" style="font-size:12px">代表玩家与领域进展请看「🌐 全景」。</span></div>`;
}
function compCard(c){
  const ax=AXES[c.domain]||Object.keys(c.strengths||{});
  const bars=ax.map(a=>{const v=(c.strengths||{})[a]||0;
    return `<div class="sx"><span class="sl">${esc(a)}</span><span class="sb"><i style="width:${v}%;background:${tierColor(v>=80?'heavy':v>=60?'notable':'worth')}"></i></span></div>`;}).join('');
  const prods=(c.products||[]).slice(0,5).map(p=>`<span class="pchip">${esc(p)}</span>`).join('');
  const dyn=(c.dynamics||[]).slice(0,3).map(d=>`<li>${esc(d)}</li>`).join('');
  return `<div class="ncard" onclick='openComp(${JSON.stringify(c.name)})'>
    <div class="nh"><span class="nm">${esc(c.name)}</span>
      <span class="sc" style="color:${tierColor((c.overall||0)>=80?'heavy':(c.overall||0)>=60?'notable':'worth')}">${c.overall||'-'}</span></div>
    <div class="pos">${esc(c.positioning||'')}</div>
    <div class="sxg">${bars}</div>
    ${prods?`<div class="pchips">${prods}</div>`:''}
    ${dyn?`<ul class="dyn">${dyn}</ul>`:''}
  </div>`;
}
function openComp(name){
  const c=DYN.find(x=>x.name===name); if(!c)return;
  const ax=AXES[c.domain]||Object.keys(c.strengths||{});
  const bars=ax.map(a=>{const v=(c.strengths||{})[a]||0;
    return `<div class="sx"><span class="sl" style="min-width:64px">${esc(a)}</span>
      <span class="sb" style="height:8px"><i style="width:${v}%;background:${tierColor(v>=80?'heavy':v>=60?'notable':'worth')}"></i></span>
      <span class="mut" style="min-width:26px;text-align:right">${v}</span></div>`;}).join('');
  const d=document.getElementById('drawer');
  d.innerHTML=`<span class="close" onclick="closeDrawer()">✕</span>
    <h2>${esc(c.name)} ${CO[c.country]||''}</h2>
    <div class="sigbig"><span class="n" style="color:${tierColor((c.overall||0)>=80?'heavy':'notable')}">${c.overall||'-'}</span>
      <span class="x"><b>综合实力</b> / 100<br>${esc(c.positioning||'')}</span></div>
    <div class="section-t">各维强项</div><div class="sxg big">${bars}</div>
    <div class="section-t">代表产品</div>
    <div class="pchips">${(c.products||[]).map(p=>`<span class="pchip">${esc(p)}</span>`).join('')||'—'}</div>
    <div class="section-t">近期动态</div>
    <ul class="dyn big">${(c.dynamics||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>—</li>'}</ul>`;
  d.classList.add('open'); document.getElementById('scrim').classList.add('on');
}
window.openComp=openComp;

function daysAgo(iso){ if(!iso)return 1e9; const t=Date.parse(iso); return isNaN(t)?1e9:(Date.now()-t)/864e5; }
function loadHint(){
  const fileMode=location.protocol==='file:';
  const why=fileMode?'当前是直接用 file:// 打开，浏览器会拦截页面读取旁边的 JSON 数据。':'页面没有读到 data.json 等数据文件。';
  const issues=LOAD_ISSUES.length?`<br><span class="mut" style="font-size:11px">${esc(LOAD_ISSUES.join(' · '))}</span>`:'';
  return `<div class="empty"><b>本地数据没有加载进来。</b><br>${why}<br>
    <span style="font-size:12px">请在终端运行: <code>cd robot-intel/docs && python3 -m http.server 8731</code><br>
    然后打开: <code>http://localhost:8731/</code></span>${issues}</div>`;
}
function getQuery(){ return (document.getElementById('fQuery')?.value||'').trim().toLowerCase(); }
function paperText(p){
  return [p.title,p.tldr,p.claim,p.verdict,p.org,p.country,p.org_type,p.best_route,(p.tags||[]).join(' '),
    (p.method_components||[]).join(' ')].filter(Boolean).join(' ').toLowerCase();
}
function hasPaperFilters(){
  return Boolean(F.route || getQuery() || document.getElementById('fTime').value!=='0'
    || document.getElementById('fCountry').value || document.getElementById('fOrgType').value);
}
function updatePaperMeta(count,total){
  document.getElementById('clearFilters').style.display=hasPaperFilters()?'':'none';
  const routeName=F.route ? (DATA.routes.find(r=>r.id===F.route)?.name||F.route) : '全部细分';
  document.getElementById('stat').textContent=`${DOMAINS[curDomain]} · ${routeName} · ${count}/${total} 篇`;
}
function resetFilters(){
  F.route=null;
  document.getElementById('fQuery').value='';
  document.getElementById('fTime').value='0';
  document.getElementById('fCountry').value='';
  document.getElementById('fOrgType').value='';
  document.getElementById('fSort').value='significance';
  syncDom();
}
window.resetFilters=resetFilters;

function curPapers(){
  return DATA.papers.filter(p=>(p.domain||'embodied_ai')===curDomain);
}
function renderList(){
  const tmax=+document.getElementById('fTime').value;
  const fco=document.getElementById('fCountry').value;
  const fot=document.getElementById('fOrgType').value;
  const sk=document.getElementById('fSort').value;
  const q=getQuery();
  const all=curPapers();
  if(!all.length && LOAD_ISSUES.some(x=>x.startsWith('data.json'))){
    document.getElementById('clearFilters').style.display='none';
    document.getElementById('stat').textContent='数据未加载';
    document.getElementById('list').innerHTML=loadHint();
    return;
  }
  let ps=all.filter(p=>{
    if(F.route && !(p.routes||[]).includes(F.route) && p.best_route!==F.route) return false;
    if(tmax && daysAgo(p.published)>tmax) return false;
    if(fco && coOf(p)!==fco) return false;
    if(fot && (p.org_type||'')!==fot) return false;
    if(q && !paperText(p).includes(q)) return false;
    return true;
  });
  ps.sort((a,b)=> sk==='significance'?(b.significance||0)-(a.significance||0)
    : sk==='date'?daysAgo(a.published)-daysAgo(b.published)
    : (b.scores?.[sk]||0)-(a.scores?.[sk]||0));
  const list=document.getElementById('list');
  updatePaperMeta(ps.length,all.length);
  if(!ps.length){ list.innerHTML=`<div class="empty">没有匹配的论文。<br><button class="clear-btn" onclick="resetFilters()">清空筛选</button></div>`; return; }
  list.innerHTML=`<div class="list">${ps.map(card).join('')}</div>`;
}
function card(p){
  const g=p.grade||'D', s=p.scores||{}, o=orgOf(p), co=coOf(p), sig=p.significance||0;
  return `<div class="pcard" onclick="openDrawer('${p.arxiv_id}')">
    ${p.thumb?`<img class="pthumb" src="${esc(p.thumb)}" loading="lazy" onerror="this.remove()">`:''}
    <div class="row1">
      <span class="sig" style="color:${tierColor(p.tier)}"><b>${sig}</b><small>分量</small></span>
      <span class="tierdot" style="background:${tierColor(p.tier)}"></span>
      ${co?`<span class="flag">${CO[co]}</span>`:''}
      ${o?`<span class="org">${esc(o)}</span>`:''}
      ${p.org_type&&OTYPE[p.org_type]?`<span class="otype">${OTYPE[p.org_type]}</span>`:''}
      <span class="grow"></span>
      <span class="badge" style="background:${GRADE[g]}" title="等级${g}·今日优先${p.read_priority||'-'}">${g}</span>
    </div>
    <h3>${esc(p.title)}</h3>
    ${p.venue?`<div class="venue">🏆 ${esc(p.venue)}</div>`:''}
    <div class="tldr">${esc(p.tldr||p.claim||'')}</div>
    <div class="foot">${esc((p.published||'').slice(0,10))}<span>·</span>优先${s.base||0}<span>·</span>总分${s.total||0}
      ${p.signals?.hf_upvotes?`<span>· HF▲${p.signals.hf_upvotes}</span>`:''}</div>
  </div>`;
}

// 今日精选 → 统一抽屉(薄包装)
function openPickDrawer(date,i){
  const pk=((PICKS.picks_by_date||{})[date]||[])[i]; if(!pk)return;
  openPaper(pk, {kind:'daily', date});
}
window.openPickDrawer=openPickDrawer;

// ===== 全景:跨领域「有没有突破 + 谁在定调」总览 =====
const OV_DOMAINS=['embodied_ai','bci','ai_science'];   // 有论文库的领域(llm_base 走发布单列)
function daysSince(d){ const t=Date.parse((d||'').slice(0,10)); return isNaN(t)?9999:(Date.now()-t)/864e5; }
function bkTier(peak){ return peak>=85?'heavy':peak>=75?'notable':peak>=60?'worth':'calm'; }
function bkLabel(peak,n){ return peak>=85?'🔥 重大突破':peak>=75?'⚡ 显著进展':peak>=60?'稳步推进':(n?'近期平静':'暂无新作'); }

// ===== 首页:本周具身 Top15 + 今日精选(精选只在这一处)=====
function renderHome(){
  const html=renderFeatured();

// 全行业:跨领域「有没有突破 + 谁在定调」总览
function renderPanoramaAll(){
  const list=document.getElementById('list');
  const all=DATA.papers||[];
  // 各领域分组
  const byDom={}; all.forEach(p=>{(byDom[p.domain]??=[]).push(p);});
  // —— 行业 hero:近30天分量最高的 3 篇(定调之作);不足则放宽到全库 ——
  const recent=all.filter(p=>daysSince(p.published)<=30).sort((a,b)=>(b.significance||0)-(a.significance||0));
  const heroPool=(recent.length>=3?recent:[...all].sort((a,b)=>(b.significance||0)-(a.significance||0)));
  const hero=heroPool.slice(0,3);
  const heroFresh=recent.length>=3;
  const heroHtml=`<div class="ovhero">
    <div class="ovhero-t">${heroFresh?'近期行业定调 · 最具突破性的论文(近30天)':'行业标杆 · 库内最具突破性的论文'}</div>
    <div class="ovhero-g">${hero.map((p,i)=>{
      const tier=p.tier||(p.significance>=75?'heavy':'notable');
      return `<div class="hcard" onclick="openDrawer('${p.arxiv_id}')">
        <span class="rank">#${i+1}</span>
        <div class="hsig" style="color:${tierColor(tier)}"><b>${p.significance||0}</b><small>/100 分量</small></div>
        ${p.venue?`<div class="venue" style="margin-bottom:5px">🏆 ${esc(p.venue)}</div>`:''}
        <div class="htt">${esc(p.title)}</div>
        <div class="hmeta"><span class="hdom">${DOMAINS[p.domain]||'—'}</span>
          ${coOf(p)?CO[coOf(p)]:''} ${orgOf(p)?esc(orgOf(p)):''}
          <span>· ${esc((p.published||'').slice(0,10))}</span></div>
      </div>`;}).join('')}</div></div>`;

  // —— 领域卡 ——
  const cards=OV_DOMAINS.map(dom=>{
    const ps=(byDom[dom]||[]).slice().sort((a,b)=>(b.significance||0)-(a.significance||0));
    if(!ps.length) return '';
    const recent30=ps.filter(p=>daysSince(p.published)<=30);
    const peak30=recent30.reduce((m,p)=>Math.max(m,p.significance||0),0);
    const tier=bkTier(peak30);
    const anchor=ps[0];                                   // 定调之作=库内分量最高
    const fresh=recent30.filter(p=>p.arxiv_id!==anchor.arxiv_id && (p.significance||0)>=68)
                        .sort((a,b)=>(b.significance||0)-(a.significance||0)).slice(0,3);
    const aTier=anchor.tier||(anchor.significance>=75?'heavy':'notable');
    return `<div class="ovcard">
      <div class="ovh"><span class="ovname" onclick="gotoDomain('${dom}')">${DOMAINS[dom]}</span>
        <span class="ovbadge bk-${tier}">${bkLabel(peak30,recent30.length)}</span></div>
      <div class="ovmeta">库内 ${ps.length} 篇 · 近30天 +${recent30.length} · 峰值分量 ${peak30||'—'}</div>
      <div class="ovsec">定调之作</div>
      <div class="ovanchor" onclick="openDrawer('${anchor.arxiv_id}')">
        <span class="as" style="color:${tierColor(aTier)}">${anchor.significance||0}</span>
        <span><span class="at">${esc(anchor.title)}</span>
          <span class="am">${coOf(anchor)?CO[coOf(anchor)]:''} ${orgOf(anchor)?esc(orgOf(anchor)):''}
            <span>· ${esc((anchor.published||'').slice(0,10))}</span></span></span></div>
      <div class="ovsec">近期突破</div>
      ${fresh.length?`<div class="ovrecent">${fresh.map(p=>`
        <div class="ovrow" onclick="openDrawer('${p.arxiv_id}')">
          <span class="rs" style="color:${tierColor(p.tier||'worth')}">${p.significance||0}</span>
          <span class="rt">${esc(p.title)}</span>
          ${coOf(p)?`<span class="rf">${CO[coOf(p)]}</span>`:''}</div>`).join('')}</div>`
        :'<div class="ovempty">近30天暂无显著突破(分量≥68)</div>'}
    </div>`;}).join('');

  // —— LLM 基模:看发布不看论文,单独一张卡 ——
  let llmCard='';
  if(LLMB&&LLMB.vendors&&LLMB.vendors.length){
    const top=LLMB.vendors.slice().sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,3);
    llmCard=`<div class="ovcard">
      <div class="ovh"><span class="ovname" onclick="gotoDomain('llm_base')">${DOMAINS.llm_base}</span>
        <span class="ovbadge bk-notable">看发布</span></div>
      <div class="ovmeta">${LLMB.vendors.length} 家大厂旗舰 · 横向格局</div>
      <div class="ovsec">领跑者</div>
      <div class="ovrecent">${top.map(v=>`
        <div class="ovrow" onclick="gotoDomain('llm_base')">
          <span class="rs" style="color:${tierColor(v.score>=80?'heavy':'notable')}">${v.score||'-'}</span>
          <span class="rt">${esc(v.name)} · ${esc(v.flagship||'')}</span>
          ${v.country&&CO[v.country]?`<span class="rf">${CO[v.country]}</span>`:''}</div>`).join('')}</div>
    </div>`;
  }

  document.getElementById('stat').textContent=`全行业 · ${all.length} 篇 · ${DATA.generated_at||''}`;
  list.innerHTML=`<div class="ovwrap"><div class="ovhint mut">点领域名进入该领域的「进展 + 代表玩家」深度页 ↓</div>${heroHtml}<div class="ovgrid">${cards}${llmCard}</div></div>`;
}

function renderFeatured(){
  let html='';
  // —— 本周具身 Top15 ——
  const wp=WEEKLY.picks||[];
  if(wp.length){
    const wk=WEEKLY.week||{};
    const shown=weeklyExpanded?wp:wp.slice(0,10);
    const rows=shown.map((p,i)=>{
      const tier=p.tier||(p.significance>=75?'heavy':p.significance>=60?'notable':'worth');
      const flag=(CO[(p.country||'').toUpperCase()])||'';
      const org=orgOf(p);
      return `<div class="wkitem" onclick="openWeeklyDrawer(${i})">
        <span class="wr">${p.rank||i+1}</span>
        <span class="wsig" style="color:${tierColor(tier)}"><b>${p.significance||0}</b><small>分量</small></span>
        <span class="wmid">
          <div class="wtt">${esc(p.title)}</div>
          <div class="wsub">${flag?flag+' ':''}${org?esc(org):'<span class="mut">—</span>'}<span class="mut">· ${DOMAINS[p.domain]||''}</span></div>
        </span>
        ${p.venue?`<span class="wv">🏆 ${esc(p.venue)}</span>`:''}</div>`;}).join('');
    const vCount=WEEKLY.venue_count||0;
    html+=`<div class="feat">
      <div class="feat-h">
        <span class="ic">📅</span><span class="ttl">本周具身 Top${wp.length}</span>
        <span class="wkrange">${esc((wk.label)||'')}</span>
        <span class="sub">综合各大学会 · 顶会 ${vCount} 篇</span>
        ${wp.length>10?`<span class="more" onclick="event.stopPropagation();toggleWeekly()">${weeklyExpanded?'收起 ▲':`展开全部 ${wp.length} ▾`}</span>`:''}
      </div>
      <div class="wkgrid">${rows}</div></div>`;
  }
  // —— 今日精选(跨领域最新一期)——
  const pbd=PICKS.picks_by_date||{};
  const dates=Object.keys(pbd).sort().reverse();
  if(dates.length){
    const latest=dates[0], today=pbd[latest]||[];
    if(today.length){
      const cards=today.map((pk,i)=>{
        const d=pk.deep||{}, flag=(CO[(pk.country||'').toUpperCase()])||'', org=orgOf(pk);
        return `<div class="pkc" style="border-left-color:${tierColor(pk.tier)}" onclick="openPickDrawer('${latest}',${i})">
          <div class="pkm"><b style="color:${tierColor(pk.tier)}">${pk.significance||0}</b>
            <span style="color:var(--mut2)">分量</span>${flag?'· '+flag:''}${org?' '+esc(org):''}
            <span style="margin-left:auto">${DOMAINS[pk.domain]||''}</span></div>
          <div class="pkhk">${esc(d.hook||pk.title)}</div>
          <div class="pkvd">${esc(d.verdict||pk.tldr||'')}</div></div>`;}).join('');
      html+=`<div class="feat">
        <div class="feat-h"><span class="ic">📌</span><span class="ttl">今日精选</span>
          <span class="wkrange">${latest}</span><span class="sub">时效窗严选 · 深度解析</span></div>
        <div class="pkgrid">${cards}</div></div>`;
    }
  }
  return html;
}

// 领域进展卡(返回 HTML,供全景域页拼装)
function dashHtml(dom){
  if(dom==='llm_base') return renderLLMBase();
  const topics=Object.values(PROGRESS.topics).filter(t=>t.domain===dom);
  if(!topics.length) return '<div class="empty">该领域进展调研生成中…</div>';
  const byRoute={};
  (DATA.papers||[]).filter(p=>(p.domain||'embodied_ai')===dom).forEach(p=>{
    const r=p.best_route; (byRoute[r]??={n:0,peak:0}); byRoute[r].n++;
    byRoute[r].peak=Math.max(byRoute[r].peak,p.significance||0); });
  return `<div class="dashgrid">`+topics.map(t=>{
    const live=byRoute[t.id]||{n:0,peak:0};
    const works=(t.works||[]);
    const wrows=works.slice(0,6).map(w=>{
      const sig=w.significance||0;
      return `<div class="wk" title="${esc(w.why||'')}">
        <span class="ws" style="color:${tierColor(sig>=80?'heavy':sig>=65?'notable':'worth')}">${sig}</span>
        <span class="wn">${esc(w.name)}</span>
        ${w.country&&CO[w.country]?`<span class="wf">${CO[w.country]}</span>`:''}
        <span class="wo">${esc(w.org||'')}${w.year?' '+esc(w.year):''}</span></div>`;}).join('');
    const more=works.length>6?`<div class="wmore" onclick="showWorks('${t.id}')">+ 还有 ${works.length-6} 篇基石</div>`:'';
    return `<div class="dcard">
      <div class="dh"><span class="nm" onclick="pickRoute('${t.id}')">${esc(t.name)}</span>
        <span class="ct">${live.n?`今日${live.n}篇·峰<span class="pk">${live.peak}</span>`:`基石${works.length}篇`}</span></div>
      ${t.activity?`<div class="activity">${esc(t.activity)}</div>`:''}
      <div class="works">${wrows||'<span class="mut" style="font-size:11px">—</span>'}</div>${more}
      ${t.verdict?`<div class="verdict"><b>⚖️ 谁更屌:</b> ${esc(t.verdict)}</div>`:''}
    </div>`;
  }).join('')+`</div>`;
}

function renderGraph(){
  const list=document.getElementById('list');
  list.innerHTML='<div id="kg" style="width:100%;height:calc(100dvh - 150px)"></div>';
  const dom=curDomain, keep=new Set();
  GRAPH.nodes.forEach(n=>{ if((n.type==='paper'||n.type==='route') && n.domain===dom) keep.add(n.id); });
  GRAPH.links.forEach(l=>{ if(keep.has(l.source) && l.type==='by') keep.add(l.target); });   // +机构
  GRAPH.links.forEach(l=>{ if(keep.has(l.source) && l.type==='in') keep.add(l.target); });   // +国家
  const nodes=GRAPH.nodes.filter(n=>keep.has(n.id)).map(n=>({...n}));
  const links=GRAPH.links.filter(l=>keep.has(l.source)&&keep.has(l.target)).map(l=>({...l}));
  document.getElementById('stat').textContent=`${DOMAINS[curDomain]} · 图谱 · ${nodes.length} 点 · ${links.length} 边`;
  if(!nodes.length){ list.innerHTML='<div class="empty">该领域暂无图谱(切到具身/脑机/AI科学看)。</div>'; return; }
  const el=document.getElementById('kg');
  KG=ForceGraph()(el).backgroundColor('#0a0a0c').graphData({nodes,links}).nodeRelSize(4)
    .nodeColor(n=> n.type==='route'?'#6e9bd6': n.type==='org'?'#9a9aa2': n.type==='country'?'#d6a84a'
      : tierColor((n.sig||0)>=80?'heavy':(n.sig||0)>=60?'notable':'worth'))
    .nodeVal(n=> n.type==='route'?16: n.type==='country'?11: n.type==='org'?4: 2)
    .nodeLabel(n=> n.type==='country'?(CONAME[n.label]||n.label):n.label)
    .linkColor(l=> l.type==='similar'?'#33414f':'#222730')
    .linkWidth(l=> l.type==='similar'?1.2:0.5)
    .onNodeClick(n=>{ if(n.type==='paper') openDrawer(n.id); })
    .width(el.clientWidth).height(el.clientHeight);
  new ResizeObserver(()=>{ if(KG){KG.width(el.clientWidth).height(el.clientHeight);} }).observe(el);
}

// ===== 统一详情抽屉:先讲人话,评分折叠到底部 =====
// 接受 普通论文 / 今日精选 / 本周精选(字段同源:export 已平铺 analysis;精选另带 deep)
function openPaper(p, ctx){
  ctx=ctx||{};
  const dp=p.deep||{};
  const s=p.scores||{}, co=coOf(p), o=orgOf(p);
  const tcol=tierColor(p.tier);
  const sec=(t,v)=>v?`<div class="section-t">${t}</div><div class="secbody">${esc(v)}</div>`:'';
  // 来源徽标
  let badge='';
  if(ctx.kind==='daily') badge=`📌 ${ctx.date||''} 今日精选 · ${DOMAINS[p.domain]||''}`;
  else if(ctx.kind==='weekly') badge=`📅 本周具身 Top${ctx.total||''} · #${ctx.rank||''} · ${ctx.week||''}`;
  else badge=`${DOMAINS[p.domain]||''}`;
  // 讲人话的总评/主张(精选优先用 deep)
  const verdict=dp.verdict||p.one_sentence_verdict||p.verdict||'';
  const method=dp.method||((p.method_components||[]).join(' · '));
  const results=dp.results||p.evidence||'';
  // 评分细节(普通论文才有完整 scores;折叠)
  const hasScore=s.total!=null||s.relevance!=null;
  const scoreBlock=hasScore?`<details class="scoredetail"><summary>评分细节</summary>
    <div class="sgrid">
      <div><b style="color:var(--rel)">${s.relevance||0}</b><span>相关/30</span></div>
      <div><b style="color:var(--con)">${s.content||0}</b><span>内容/30</span></div>
      <div><b style="color:var(--heat)">${s.heat||0}</b><span>热度/20</span></div>
      <div><b style="color:var(--qual)">${s.quality||0}</b><span>质量/20</span></div></div>
    <div class="mut" style="font-size:12px">今日优先 <b>${s.base||0}</b>/60 · 总分 <b>${s.total||0}</b>/100 · 新颖度 ${p.novelty||0}/10</div>
   </details>`:'';
  const d=document.getElementById('drawer');
  d.innerHTML=`<span class="close" onclick="closeDrawer()">✕</span>
    <div class="mut" style="font-size:12px">${esc(badge)}</div>
    ${p.thumb?`<img src="${esc(p.thumb)}" style="width:100%;border-radius:10px;margin:8px 0 12px;display:block" onerror="this.remove()">`:''}
    ${dp.hook?`<div style="font-size:16px;font-weight:700;line-height:1.5;margin:8px 0 6px">${esc(dp.hook)}</div>`:''}
    <h2 style="font-size:17px;margin-top:${dp.hook?'4px':'8px'}">${esc(p.title)}</h2>
    ${p.venue?`<div class="venue" style="margin-bottom:8px">🏆 ${esc(p.venue)}</div>`:''}
    <div class="mut" style="font-size:12px">${CO[co]?CO[co]+' '+(CONAME[co]||'')+' · ':''}${o?'🏛️ '+esc(o)+' · ':''}${OTYPE[p.org_type]?OTYPE[p.org_type]+' · ':''}${esc((p.published||'').slice(0,10))} · ${esc(p.arxiv_id)}</div>
    <div class="sigbig"><span class="n" style="color:${tcol}">${p.significance||0}</span>
      <span class="x"><b style="color:${tcol}">分量分</b> / 100<br>${esc(p.significance_reason||'')}</span></div>
    ${verdict?`<div class="section-t">⚖️ 一句话判断</div><div class="secbody" style="font-weight:600">${esc(verdict)}</div>`:''}
    ${sec('🎯 核心主张',p.claim||p.tldr)}
    ${sec('⚡ 为什么现在值得读',dp.why_now)}
    ${sec('🧩 解决什么问题',dp.problem)}
    ${sec('🔧 方法',method)}
    ${sec('📊 关键结果与证据',results)}
    ${sec('⚠️ 局限与存疑',dp.limitations)}
    ${sec('🧭 对该路线意味着什么',dp.significance_take)}
    ${sec('👤 谁该读',dp.who_should_read)}
    ${(p.input||p.output)?`<dl class="kv"><dt>输入</dt><dd>${esc(p.input||'-')}</dd><dt>输出</dt><dd>${esc(p.output||'-')}</dd>
      ${p.sim2real_status?`<dt>Sim2Real</dt><dd>${esc(p.sim2real_status)}</dd>`:''}${p.reproducibility?`<dt>可复现</dt><dd>${esc(p.reproducibility)}</dd>`:''}</dl>`:''}
    ${(p.tags&&p.tags.length)?`<div class="section-t">标签</div><div>${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
    ${scoreBlock}
    <div style="margin-top:14px">
      <a class="btn" href="${esc(p.url)}" target="_blank">arXiv ↗</a>
      ${p.pdf_url?`<a class="btn" href="${esc(p.pdf_url)}" target="_blank">PDF ↗</a>`:''}
      <a class="btn" style="background:#ff2e4d;color:#fff;border-color:#ff2e4d"
         href="xhs_preview.html?id=${encodeURIComponent(p.arxiv_id)}" target="_blank">📕 生成小红书 ↗</a></div>`;
  d.classList.add('open'); document.getElementById('scrim').classList.add('on');
  document.querySelectorAll('.pcard').forEach(c=>c.classList.remove('sel'));
}
window.openPaper=openPaper;
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('scrim').classList.remove('on');}
window.openDrawer=openDrawer; window.closeDrawer=closeDrawer;
</script>
</body>
</html>
