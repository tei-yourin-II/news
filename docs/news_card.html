<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>速报出图 · 小红书图片排版 — 情报台</title>
<style>
  /* ===== 新闻速报贴:电讯速报 Newswire 风(暖琥珀+速报红),与论文帖冷钢蓝刻意区分 ===== */
  :root{
    --bg:#08090b; --slide:#0d0f13; --panel:#15181d; --ink:#eef2f6; --ink2:#a8b2bf; --mut:#646e7e;
    --line:rgba(168,178,196,.11); --line2:rgba(168,178,196,.22);
    --cy:#f6b340; --cy2:#ffd27a; --cyd:#7a5212;   /* 新闻帖识别色:暖琥珀(与论文帖冷钢蓝区分) */
    --hot:#ff5d3b;                                 /* 速报标:警示橙红 */
    --jp:#fb7185; --cn:#fbbf24; --us:#38bdf8;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,"Roboto Mono",monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:radial-gradient(1200px 600px at 50% -10%,#1b1612,#08070a 62%); color:#dbe2ea;
       padding:18px 0 28px; font:14px/1.6 "PingFang SC","Hiragino Sans",-apple-system,Segoe UI,sans-serif;}
  .mono{font-family:var(--mono);}
  a{color:inherit;}
  button{font:inherit; cursor:pointer; color:inherit;}

  .topbar{max-width:760px; margin:0 auto 14px; padding:0 16px; display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap;}
  .topbar .back{color:#9fb2cf; text-decoration:none; font-size:13px;}
  .seg{display:flex; gap:3px; background:rgba(255,255,255,.06); padding:3px; border-radius:10px; border:1px solid var(--line);}
  .seg button{padding:5px 14px; border:0; background:transparent; color:#9fb2cf; border-radius:8px; font-size:13px; font-weight:600;}
  .seg button.on{background:var(--cy); color:#0b1015;}
  .topbar select{background:rgba(255,255,255,.06); color:#dfe8f3; border:1px solid var(--line2);
                 border-radius:8px; padding:5px 9px; font-size:12.5px;}
  .topbar .tip{width:100%; font-size:12px; color:var(--mut); margin-top:2px;}

  .slides{max-width:760px; margin:0 auto; padding:0 16px; display:flex; flex-wrap:wrap; gap:16px; justify-content:center;}
  /* 3:4 画布:360×480(导出 ×3 = 1080×1440) */
  .slide{width:360px; height:480px; background:var(--slide); color:var(--ink); position:relative;
         overflow:hidden; box-shadow:0 14px 40px rgba(0,0,0,.6); border-radius:6px;
         border:1px solid var(--line2);
         background-image:
           linear-gradient(rgba(168,178,196,.04) 1px,transparent 1px),
           linear-gradient(90deg,rgba(168,178,196,.04) 1px,transparent 1px);
         background-size:30px 30px;}

  /* —— 封面:电讯速报 Newswire —— */
  .cv{width:100%; height:100%; padding:30px 28px; display:flex; flex-direction:column; position:relative; overflow:hidden;
      background:radial-gradient(620px 340px at 84% -14%,rgba(246,179,64,.12),transparent 62%);}
  .cv .mast{font-family:var(--mono); font-size:11px; letter-spacing:.24em; text-transform:uppercase;
            color:var(--cy); font-weight:700; display:flex; justify-content:space-between; align-items:center; z-index:1;}
  .cv .mast .dt{color:var(--ink2); letter-spacing:.1em;}
  /* 电讯条带:虚线胶带感 */
  .cv .ticker{height:6px; margin:12px 0 0; border-radius:2px; z-index:1;
              background:repeating-linear-gradient(90deg,var(--cy) 0 15px,transparent 15px 23px);}
  /* 速报标 + 今日条数 */
  .cv .flash{display:flex; align-items:center; gap:12px; margin:30px 0 0; z-index:1;}
  .cv .flash .tag{font-size:15px; font-weight:800; letter-spacing:.16em; color:#1a1206;
                  background:var(--hot); padding:5px 13px 4px; border-radius:4px; box-shadow:0 5px 16px rgba(255,93,59,.32);}
  .cv .flash .cnt{font-family:var(--mono); font-size:13px; color:var(--ink2); letter-spacing:.04em;}
  .cv .flash .cnt b{color:var(--cy); font-size:19px; font-weight:800; margin:0 1px;}
  .cv .big{font-size:28px; font-weight:800; line-height:1.26; margin:18px 0 0; letter-spacing:-.005em; color:#f7f4ee; z-index:1;}
  .cv .big em{font-style:normal; color:var(--cy);}                 /* 数字/金额自动高亮 */
  .cv .sub{font-size:13.5px; color:var(--ink2); margin-top:14px; line-height:1.55; z-index:1;}
  .cv .spacer{flex:1;}
  .cv .foot{font-size:12px; color:var(--mut); display:flex; justify-content:space-between; align-items:center;
            border-top:1px solid var(--line); padding-top:12px; z-index:1;}
  .cv .foot .flags{font-size:15px; letter-spacing:.14em;}
  .cv .foot .dl{font-family:var(--mono); letter-spacing:.04em;}
  .cv .wm{position:absolute; right:-8px; bottom:64px; font-size:104px; font-weight:800; line-height:.9;
          color:rgba(246,179,64,.06); letter-spacing:-.02em; pointer-events:none;
          font-family:"PingFang SC","Hiragino Sans",sans-serif; writing-mode:vertical-rl;}

  /* —— 内容页 —— */
  .ct{width:100%; height:100%; padding:24px 26px 0; display:flex; flex-direction:column;}
  .ct .chead{display:flex; align-items:baseline; gap:8px; border-bottom:1px solid var(--line2); padding-bottom:8px; flex:0 0 auto;}
  .ct .chead .s1{font-size:13px; font-weight:800; color:var(--ink);}
  .ct .chead .s1::before{content:"▸ "; color:var(--cy);}
  .ct .chead .s2{font-family:var(--mono); font-size:10.5px; color:var(--mut); margin-left:auto; letter-spacing:.04em;}
  .scontent{flex:1 1 auto; overflow:hidden; padding-top:13px;}
  .scontent .lead{font-size:14.5px; line-height:1.6; color:var(--ink); margin:0 0 11px; font-weight:600;}
  .scontent .sec{font-size:15px; font-weight:800; margin:13px 0 7px; color:#f4f9ff;
                 border-left:3px solid var(--cy); padding-left:9px;}
  .scontent .sec:first-child{margin-top:0;}
  .scontent .li,.scontent .p,.scontent .num{font-size:12.7px; line-height:1.5; color:var(--ink2); margin:6px 0; padding-left:2px;}
  .scontent b{color:var(--cy); font-weight:700;}
  .scontent .tags{font-family:var(--mono); font-size:11.5px; color:var(--cy2); margin-top:12px; line-height:1.8; opacity:.9;}
  .ct .sfoot{flex:0 0 auto; border-top:1px solid var(--line); padding:8px 0 10px; font-size:10px;
             color:var(--mut); display:flex; justify-content:space-between; font-family:var(--mono); letter-spacing:.03em;}
  .pgno{position:absolute; right:13px; bottom:9px; font-size:10px; color:var(--mut); font-family:var(--mono); font-variant-numeric:tabular-nums;}

  .exportbar{position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:10px; z-index:50;}
  .exportbar button{font-size:14px; font-weight:700; color:#0b1015; background:var(--cy); border:0;
                    border-radius:11px; padding:13px 16px; box-shadow:0 8px 22px rgba(0,0,0,.35);}
  .exportbar button.ghost{background:#1b2026; color:#dfe8f3; box-shadow:0 8px 22px rgba(0,0,0,.4);}
  .exportbar .hint{font-size:11px; color:var(--mut); text-align:center; max-width:170px; line-height:1.5;}
  .empty{max-width:760px; margin:40px auto; text-align:center; color:#9fb2cf; font-size:14px; line-height:1.8;}
  .empty code{background:#14171c; color:var(--cy); padding:2px 8px; border-radius:5px; font-family:var(--mono);}

  #imgsink{position:fixed; inset:0; background:rgba(4,8,16,.96); z-index:80; display:none; overflow:auto; padding:14px;}
  #imgsink.on{display:block;}
  #imgsink .bar{position:sticky; top:0; display:flex; justify-content:space-between; align-items:center;
                padding:6px 4px 12px; color:#fff;}
  #imgsink .x{font-size:22px; padding:2px 10px; cursor:pointer;}
  #imgsink img{display:block; width:100%; max-width:380px; margin:0 auto 14px; border-radius:8px;}
  @media(max-width:760px){
    .exportbar{position:sticky; right:auto; bottom:auto; flex-direction:row; justify-content:center; margin:18px auto 0; max-width:360px;}
    .exportbar .hint{display:none;}
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="news.html">← 业界动态</a>
  <div class="brand" style="display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--cy);letter-spacing:.04em;">📰 每日速报</div>
  <select id="dateSel"></select>
  <div class="tip">3:4 小红书图片 · 每页 360×480(导出 ×3 = 1080×1440)。改文案不用重导,渲染永远最新。</div>
</div>

<div class="slides" id="slides"></div>
<div class="empty" id="empty" style="display:none"></div>

<div class="exportbar">
  <button onclick="exportAll()">⬇️ 导出全部</button>
  <button class="ghost" onclick="exportOne(0)">⬇️ 只导出封面</button>
  <div class="hint">导出 1080×1440 PNG,存相册去小红书发</div>
</div>

<div id="imgsink"><div class="bar"><b>长按每张图 → 存储图像</b>
  <span class="x" onclick="document.getElementById('imgsink').classList.remove('on')">✕</span></div>
  <div id="imgsink-body"></div></div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
  const SLIDES=document.getElementById('slides');
  let REPORTS={daily:{}}, kind='daily', curDate='', DATA=null, RENDERED=[];  // 只做每日,不再有周报

  const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  const qp=k=>new URLSearchParams(location.search).get(k)||'';

  // 数字/金额自动高亮(esc 后再包 em,安全)
  const hlNum=line=>esc(line).replace(/(\d[\d.,]*\s*[亿万兆%]?(?:日元|美元|元)?)/g,'<em>$1</em>');
  function coverSlide(){
    const c=DATA.cover||{}, s=document.createElement('div'); s.className='slide';
    const n=(DATA.blocks||[]).filter(b=>b.type==='li').length;   // 今日条数
    const date=esc(DATA.period_label||DATA.date||'');
    s.innerHTML=`<div class="cv">
      <div class="mast"><span>情报台 · INTEL WIRE</span><span class="dt">${date}</span></div>
      <div class="ticker"></div>
      <div class="flash"><span class="tag">速报</span>${n?`<span class="cnt">今日 <b>${n}</b> 条</span>`:''}</div>
      <div class="big">${(c.title_lines||[]).map(hlNum).join('<br>')}</div>
      ${c.subtitle?`<div class="sub">${esc(c.subtitle)}</div>`:''}
      <div class="spacer"></div>
      <div class="foot"><span class="flags">🇯🇵 🇨🇳 🇺🇸</span><span class="dl">三地聚合 · ${date}</span></div>
      <div class="wm">速报</div></div>`;
    return s;
  }
  function contentSlide(){
    const s=document.createElement('div'); s.className='slide';
    s.innerHTML=`<div class="ct"><div class="chead"><span class="s1">${esc(DATA.cover?.series||'行业速报')}</span>
      <span class="s2">${esc(DATA.period_label||DATA.date||'')}</span></div>
      <div class="scontent"></div>
      <div class="sfoot"><span>情报台 · 具身 / 脑机 / 基模 · GOOGLE NEWS RSS</span><span class="pno"></span></div></div>`;
    return s;
  }
  function createBlock(b){
    const el=document.createElement('div');
    if(b.type==='tags'){ el.className='tags'; el.textContent=(b.items||[]).map(t=>'#'+t).join('  '); }
    else{ el.className=['lead','sec','li','p','num'].includes(b.type)?b.type:'p'; el.innerHTML=inline(b.text||''); }
    return el;
  }
  function paginate(pages){
    const nodes=(DATA.blocks||[]).map(createBlock);
    let cur=contentSlide(); SLIDES.appendChild(cur); pages.push(cur);
    let area=cur.querySelector('.scontent');
    nodes.forEach(node=>{
      area.appendChild(node);
      if(area.scrollHeight>area.clientHeight && area.children.length>1){
        area.removeChild(node);
        cur=contentSlide(); SLIDES.appendChild(cur); pages.push(cur);
        area=cur.querySelector('.scontent'); area.appendChild(node);
      }
    });
    // 孤儿:页尾是 sec 标题 → 挪到下一页开头
    for(let i=0;i<pages.length-1;i++){
      const a=pages[i].querySelector('.scontent'), last=a.lastElementChild;
      if(last && last.classList.contains('sec')){
        a.removeChild(last);
        const na=pages[i+1].querySelector('.scontent'); na.insertBefore(last,na.firstChild);
      }
    }
  }
  function render(){
    SLIDES.innerHTML='';
    if(!DATA){ document.getElementById('empty').style.display=''; return []; }
    document.getElementById('empty').style.display='none';
    const cover=coverSlide(); SLIDES.appendChild(cover);
    const pages=[]; paginate(pages);
    const all=[cover].concat(pages);
    // 页码写进内容页页脚右侧(封面不标),避免与角标重叠
    all.forEach((s,i)=>{ const pno=s.querySelector('.pno'); if(pno) pno.textContent=(i+1)+' / '+all.length; });
    return all;
  }

  function buildDates(){
    const map=REPORTS[kind]||{}, dates=Object.keys(map).sort().reverse();
    const sel=document.getElementById('dateSel'); sel.innerHTML='';
    if(!dates.length){ sel.style.display='none'; DATA=null; RENDERED=render(); showEmpty(); return; }
    sel.style.display='';
    if(!curDate||!map[curDate]) curDate=dates[0];
    dates.forEach(d=>{ const o=document.createElement('option'); o.value=d;
      o.textContent=(map[d].period_label||d)+(d===dates[0]?' · 最新':''); if(d===curDate)o.selected=true; sel.appendChild(o); });
    DATA=map[curDate]; RENDERED=render();
  }
  function showEmpty(){
    document.getElementById('empty').innerHTML=`还没有日报。<br>
      本地生成:<code>python3 gen_news_report.py --daily --force</code>(需 QWEN_API_KEY)`;
  }

  document.getElementById('dateSel').onchange=e=>{ curDate=e.target.value; DATA=(REPORTS[kind]||{})[curDate]; RENDERED=render(); };

  fetch('news_reports.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{
    REPORTS={daily:j.daily||{}};
    curDate=qp('date')||'';
    buildDates();
  }).catch(()=>{ DATA=null; render(); document.getElementById('empty').style.display='';
    document.getElementById('empty').innerHTML='没读到 news_reports.json。<br>先跑 <code>python3 gen_news_report.py --force</code>'; });

  // ===== 导出(html2canvas,与论文出图一致)=====
  function isMobile(){ return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(window.matchMedia&&matchMedia('(pointer:coarse)').matches); }
  function fname(){ return (DATA?(DATA.kind+'_'+(DATA.date||'')):'report'); }
  function capture(el,idx){
    return html2canvas(el,{scale:3,useCORS:true,backgroundColor:'#0d0f13',logging:false}).then(canvas=>{
      const url=canvas.toDataURL('image/png');
      if(isMobile()){ const img=new Image(); img.src=url; document.getElementById('imgsink-body').appendChild(img); }
      else{ const a=document.createElement('a'); a.download='speibao_'+fname()+'_p'+(idx+1)+'.png'; a.href=url; a.click(); }
    });
  }
  function exportOne(idx){
    if(typeof html2canvas==='undefined'){ alert('html2canvas 没加载(可能没联网)'); return; }
    if(!RENDERED[idx]){ alert('还没渲染好'); return; }
    if(isMobile()){ document.getElementById('imgsink-body').innerHTML=''; document.getElementById('imgsink').classList.add('on'); }
    capture(RENDERED[idx],idx);
  }
  async function exportAll(){
    if(typeof html2canvas==='undefined'){ alert('html2canvas 没加载(可能没联网)'); return; }
    if(!RENDERED.length){ alert('还没渲染好'); return; }
    if(isMobile()){ document.getElementById('imgsink-body').innerHTML=''; document.getElementById('imgsink').classList.add('on'); }
    for(let i=0;i<RENDERED.length;i++){ await capture(RENDERED[i],i); await new Promise(r=>setTimeout(r,250)); }
  }
  window.exportOne=exportOne; window.exportAll=exportAll;
</script>
</body>
</html>
