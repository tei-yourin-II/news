<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周论文贴 · 本周具身 Top — 情报台</title>
<style>
  /* ===== 深色终端科技风:与新闻速报贴共用同一套视觉语言 ===== */
  :root{
    --bg:#08090b; --slide:#0d0f13; --panel:#15181d; --ink:#eef2f6; --ink2:#a8b2bf; --mut:#646e7e;
    --line:rgba(168,178,196,.11); --line2:rgba(168,178,196,.22);
    --cy:#7fa8cc; --cy2:#9bbbd9; --cyd:#3d566e;
    --heavy:#7fa8cc; --worth:#8a97a8;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,"Roboto Mono",monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:radial-gradient(1200px 600px at 50% -10%,#16191e,#08090b 62%); color:#dbe2ea;
       padding:18px 0 28px; font:14px/1.6 "PingFang SC","Hiragino Sans",-apple-system,Segoe UI,sans-serif;}
  .mono{font-family:var(--mono);}
  a{color:inherit;} button{font:inherit; cursor:pointer; color:inherit;}

  .topbar{max-width:760px; margin:0 auto 14px; padding:0 16px; display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap;}
  .topbar .back{color:#9fb2cf; text-decoration:none; font-size:13px;}
  .topbar .title{font-weight:700; font-size:14px;}
  .topbar .title b{color:var(--cy);}
  .topbar .tip{width:100%; font-size:12px; color:var(--mut); margin-top:2px;}

  .slides{max-width:760px; margin:0 auto; padding:0 16px; display:flex; flex-wrap:wrap; gap:16px; justify-content:center;}
  .slide{width:360px; height:480px; background:var(--slide); color:var(--ink); position:relative;
         overflow:hidden; box-shadow:0 14px 40px rgba(0,0,0,.6); border-radius:6px; border:1px solid var(--line2);
         background-image:
           linear-gradient(rgba(168,178,196,.04) 1px,transparent 1px),
           linear-gradient(90deg,rgba(168,178,196,.04) 1px,transparent 1px);
         background-size:30px 30px;}

  /* —— 封面 —— */
  .cv{width:100%; height:100%; padding:30px 28px; display:flex; flex-direction:column; position:relative;
      background:radial-gradient(600px 300px at 80% -10%,rgba(127,168,204,.06),transparent 60%);}
  .cv .mast{font-family:var(--mono); font-size:11px; letter-spacing:.24em; text-transform:uppercase;
            color:var(--cy); font-weight:600; display:flex; justify-content:space-between;}
  .cv .mast .dt{color:var(--ink2); letter-spacing:.08em;}
  .cv .rule{height:2px; margin:10px 0 0; background:linear-gradient(90deg,var(--cy),transparent 78%);}
  .cv .ribbon{display:inline-flex; align-items:center; gap:7px; align-self:flex-start; margin:24px 0 0;
              color:var(--cy); font-size:12.5px; font-weight:700; letter-spacing:.08em;}
  .cv .ribbon::before{content:""; width:4px; height:15px; background:var(--cy); border-radius:1px;}
  .cv .big{font-size:38px; font-weight:800; line-height:1.18; margin:14px 0 0; letter-spacing:-.01em; color:#f4f9ff;}
  .cv .big em{font-style:normal; color:var(--cy);}
  .cv .sub{font-size:14px; color:var(--ink2); margin-top:14px; line-height:1.6;}
  .cv .stat{display:flex; gap:26px; margin-top:20px; font-family:var(--mono);}
  .cv .stat .n{font-size:28px; font-weight:800; color:var(--cy); line-height:1;}
  .cv .stat .l{font-size:11px; color:var(--mut); margin-top:5px; letter-spacing:.05em;}
  .cv .spacer{flex:1;}
  .cv .foot{font-size:11.5px; color:var(--mut); font-family:var(--mono); letter-spacing:.03em; border-top:1px solid var(--line); padding-top:11px;}
  .cv .watermark{position:absolute; right:-4px; bottom:34px; font-size:150px; font-weight:800;
                 color:rgba(168,178,196,.05); line-height:1; pointer-events:none; font-family:var(--mono);}

  /* —— 论文页 —— */
  .pg{width:100%; height:100%; display:flex; flex-direction:column; position:relative;}
  .banner{position:relative; height:130px; flex:0 0 130px; overflow:hidden; background:#060a13;}
  .banner img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.26;}
  .banner .gr{position:absolute; inset:0; background:linear-gradient(180deg,rgba(8,9,11,.5),rgba(13,15,19,.8) 52%,rgba(13,15,19,.99));}
  .banner .chip{position:absolute; top:13px; left:16px; font-family:var(--mono); font-size:10.5px; letter-spacing:.06em;
                color:var(--cy); border:1px solid rgba(127,168,204,.38); border-radius:5px; padding:3px 9px;
                background:rgba(13,15,19,.5); backdrop-filter:blur(3px);}
  .banner .rk{position:absolute; left:16px; bottom:8px; font-family:var(--mono); font-size:46px; font-weight:800;
              color:var(--cy); line-height:.9; text-shadow:0 2px 12px rgba(0,0,0,.7);}
  .banner .rk small{font-size:15px; opacity:.6;}
  .banner .sig{position:absolute; right:16px; bottom:11px; text-align:right; font-family:var(--mono);}
  .banner .sig .v{font-size:32px; font-weight:800; line-height:1; color:#f4f9ff; text-shadow:0 2px 12px rgba(0,0,0,.7);}
  .banner .sig .l{font-size:10px; color:var(--ink2); letter-spacing:.1em; margin-top:3px;}
  .banner .sig .onlist{font-size:15px; font-weight:700; color:var(--worth); letter-spacing:.12em;
                       border:1px solid var(--line2); border-radius:5px; padding:3px 10px;}
  .banner .venue{position:absolute; right:16px; top:13px; font-size:10.5px; color:#ffd84d; font-weight:600;}

  .body{flex:1 1 auto; min-height:0; padding:15px 22px 0; display:flex; flex-direction:column; overflow:hidden;}
  .ttl{flex:0 0 auto; font-size:16.5px; font-weight:800; line-height:1.3; color:#f4f9ff; letter-spacing:-.005em;
       display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
  .orgrow{flex:0 0 auto; display:flex; align-items:center; gap:8px; margin-top:10px; font-size:12px; color:var(--ink2); flex-wrap:wrap;}
  .orgrow .g{display:inline-flex; align-items:center; gap:4px; font-weight:600; color:var(--ink);}
  .orgrow .route{font-family:var(--mono); font-size:10.5px; color:var(--cy2); border:1px solid var(--line2); border-radius:4px; padding:1px 7px;}
  .orgrow .grade{margin-left:auto; font-family:var(--mono); font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:4px;}
  .txt{flex:1 1 auto; min-height:0; overflow:hidden;}        /* 文本区:超出即裁剪,绝不挤压页脚 */
  .lead-l{font-size:11px; font-weight:700; color:var(--cy); letter-spacing:.04em; margin:14px 0 6px;
          display:flex; align-items:center; gap:6px;}
  .lead-l::before{content:""; width:3px; height:12px; background:var(--cy); border-radius:1px;}
  .verdict{font-size:13px; line-height:1.55; color:var(--ink); font-weight:600;
           display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
  .tldr{font-size:12px; line-height:1.55; color:var(--ink2); margin-top:9px;
        display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;}
  .tags{flex:0 0 auto; font-family:var(--mono); font-size:10.5px; color:var(--cy2); opacity:.85; white-space:nowrap; overflow:hidden;
        text-overflow:ellipsis; margin:10px 0 8px;}
  .pfoot{flex:0 0 auto; border-top:1px solid var(--line); padding:8px 0 11px; font-size:9.5px; font-family:var(--mono);
         color:var(--mut); display:flex; justify-content:space-between; letter-spacing:.03em;}

  .exportbar{position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:10px; z-index:50;}
  .exportbar button{font-size:14px; font-weight:700; color:#0b1015; background:var(--cy); border:0; border-radius:11px; padding:13px 16px; box-shadow:0 8px 22px rgba(0,0,0,.35);}
  .exportbar button.ghost{background:#1b2026; color:#dfe8f3; box-shadow:0 8px 22px rgba(0,0,0,.4);}
  .exportbar .hint{font-size:11px; color:var(--mut); text-align:center; max-width:170px; line-height:1.5;}
  .empty{max-width:760px; margin:40px auto; text-align:center; color:#9fb2cf; font-size:14px; line-height:1.8;}
  .empty code{background:#0f1830; color:var(--cy); padding:2px 8px; border-radius:5px; font-family:var(--mono);}

  #imgsink{position:fixed; inset:0; background:rgba(4,8,16,.96); z-index:80; display:none; overflow:auto; padding:14px;}
  #imgsink.on{display:block;}
  #imgsink .bar{position:sticky; top:0; display:flex; justify-content:space-between; align-items:center; padding:6px 4px 12px; color:#fff;}
  #imgsink .x{font-size:22px; padding:2px 10px; cursor:pointer;}
  #imgsink img{display:block; width:100%; max-width:380px; margin:0 auto 14px; border-radius:8px;}
  @media(max-width:760px){
    .exportbar{position:sticky; right:auto; bottom:auto; flex-direction:row; justify-content:center; margin:18px auto 0; max-width:360px;}
    .exportbar .hint{display:none;}
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="index.html">← 研究台</a>
  <div class="title">周论文贴 · <b>本周具身 Top</b></div>
  <div class="tip">3:4 小红书图片 · 封面 + 本周全部入选论文,每篇一页。数据来自 weekly_picks.json,渲染永远最新。</div>
</div>

<div class="slides" id="slides"></div>
<div class="empty" id="empty" style="display:none"></div>

<div class="exportbar">
  <button onclick="exportAll()">⬇️ 导出全部</button>
  <button class="ghost" onclick="exportOne(0)">⬇️ 只导出封面</button>
  <div class="hint">导出 1080×1440 PNG,存相册去小红书发</div>
</div>

<div id="imgsink"><div class="bar"><b>长按每张图 → 存储图像</b>
  <span class="x" onclick="document.getElementById('imgsink').classList.remove('on')">✕</span></div>
  <div id="imgsink-body"></div></div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
  const SLIDES=document.getElementById('slides');
  const CO={US:'🇺🇸',CN:'🇨🇳',JP:'🇯🇵',EU:'🇪🇺',UK:'🇬🇧',KR:'🇰🇷',DE:'🇩🇪',FR:'🇫🇷',unknown:'🏳️',Other:'🏳️'};
  const DOMAINS={embodied_ai:'具身智能',bci:'脑机接口',ai_science:'AI×科学',llm_base:'LLM基模'};
  const ROUTES={world_model:'世界模型',vla:'VLA',dexterous_manipulation:'灵巧操作',whole_body_control:'全身控制',
                locomotion:'运动控制',navigation:'导航',sim2real:'Sim2Real',rl:'强化学习',imitation:'模仿学习'};
  const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  let WK=null, RENDERED=[];

  function gradeColor(g){ return {A:'#7bbf9e',B:'#7fa8cc',C:'#7c9cc4',D:'#94a3b8'}[g]||'#94a3b8'; }

  function coverSlide(){
    const wk=WK.week||{}, vs=WK.venues||[];
    const s=document.createElement('div'); s.className='slide';
    s.innerHTML=`<div class="cv">
      <div class="mast"><span>情报台 · PAPER WEEKLY</span><span class="dt">${esc(wk.label||'')}</span></div>
      <div class="rule"></div>
      <div class="ribbon">本周具身智能 · 综合各大顶会</div>
      <div class="big">本周论文<br><em>重磅榜</em></div>
      <div class="sub">${esc(wk.start||'')} ~ ${esc(wk.end||'')} · 按「分量」严选排序,逐篇锐评</div>
      <div class="stat">
        <div><div class="n">${WK.count||(WK.picks||[]).length}</div><div class="l">入选论文</div></div>
        <div><div class="n">${WK.venue_count||vs.length}</div><div class="l">顶会覆盖</div></div>
      </div>
      <div class="spacer"></div>
      <div class="foot">${vs.length?esc(vs.join(' · ')):'CoRL · ICML · ICRA · RSS'}　|　具身智能情报台</div>
      <div class="watermark">Σ</div></div>`;
    return s;
  }

  function paperSlide(p,idx,total){
    const s=document.createElement('div'); s.className='slide';
    const flag=CO[(p.country||'').toUpperCase()]||CO[p.country]||'';
    const route=ROUTES[p.best_route]||p.best_route||'';
    const dom=DOMAINS[p.domain]||'';
    const grade=p.grade||''; const tier=p.tier==='heavy'?'重磅':p.tier==='worth'?'值得':'';
    const thumb=p.thumb||('assets/thumbs/'+(p.arxiv_id||'')+'.jpg');
    const verdict=p.one_sentence_verdict||'';
    const tldr=p.tldr||p.claim||'';
    const tags=(p.tags||[]).map(t=>'#'+t).join('  ');
    s.innerHTML=`<div class="pg">
      <div class="banner">
        <img src="${esc(thumb)}" alt="" onerror="this.style.display='none'">
        <div class="gr"></div>
        <div class="chip">${esc(dom)}${route?' · '+esc(route):''}</div>
        ${p.venue?`<div class="venue">🏆 ${esc(p.venue)}</div>`:''}
        <div class="rk"><small>#</small>${String(p.rank||idx+1).padStart(2,'0')}</div>
        ${(p.significance||0)>=70
          ? `<div class="sig"><div class="v">${p.significance}</div><div class="l">分量</div></div>`
          : `<div class="sig"><div class="onlist">上榜</div></div>`}
      </div>
      <div class="body">
        <div class="ttl">${esc(p.title)}</div>
        <div class="orgrow">
          <span class="g">${flag?flag+' ':''}${esc(p.org||'—')}</span>
          ${route?`<span class="route">${esc(route)}</span>`:''}
          ${grade?`<span class="grade" style="color:${gradeColor(grade)};border:1px solid ${gradeColor(grade)}44">${esc(grade)}${tier?' · '+tier:''}</span>`:''}
        </div>
        <div class="txt">
          ${verdict?`<div class="lead-l">一句话锐评</div><div class="verdict">${esc(verdict)}</div>`:''}
          ${tldr?`<div class="tldr">${esc(tldr)}</div>`:''}
        </div>
        ${tags?`<div class="tags">${esc(tags)}</div>`:''}
        <div class="pfoot"><span>arXiv ${esc(p.arxiv_id||'')}</span><span>本周 Top ${idx+1} / ${total}</span></div>
      </div></div>`;
    return s;
  }

  function render(){
    SLIDES.innerHTML='';
    if(!WK||!(WK.picks||[]).length){ document.getElementById('empty').style.display=''; return []; }
    document.getElementById('empty').style.display='none';
    const picks=WK.picks, total=picks.length;
    const cover=coverSlide(); SLIDES.appendChild(cover);
    const all=[cover];
    picks.forEach((p,i)=>{ const sl=paperSlide(p,i,total); SLIDES.appendChild(sl); all.push(sl); });
    return all;  // 页码已在每页 pfoot 右侧(本周 Top x / N),不再叠加独立角标
  }

  fetch('weekly_picks.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{ WK=j; RENDERED=render(); })
    .catch(()=>{ document.getElementById('empty').style.display='';
      document.getElementById('empty').innerHTML='没读到 weekly_picks.json。<br>先跑 <code>python3 pick_weekly.py</code>'; });

  // ===== 导出 =====
  function isMobile(){ return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(window.matchMedia&&matchMedia('(pointer:coarse)').matches); }
  function capture(el,idx){
    return html2canvas(el,{scale:3,useCORS:true,backgroundColor:'#0d0f13',logging:false}).then(canvas=>{
      const url=canvas.toDataURL('image/png');
      if(isMobile()){ const img=new Image(); img.src=url; document.getElementById('imgsink-body').appendChild(img); }
      else{ const a=document.createElement('a'); a.download='zhoulunwen_p'+(idx+1)+'.png'; a.href=url; a.click(); }
    });
  }
  function exportOne(idx){
    if(typeof html2canvas==='undefined'){ alert('html2canvas 没加载(可能没联网)'); return; }
    if(!RENDERED[idx]){ alert('还没渲染好'); return; }
    if(isMobile()){ document.getElementById('imgsink-body').innerHTML=''; document.getElementById('imgsink').classList.add('on'); }
    capture(RENDERED[idx],idx);
  }
  async function exportAll(){
    if(typeof html2canvas==='undefined'){ alert('html2canvas 没加载(可能没联网)'); return; }
    if(!RENDERED.length){ alert('还没渲染好'); return; }
    if(isMobile()){ document.getElementById('imgsink-body').innerHTML=''; document.getElementById('imgsink').classList.add('on'); }
    for(let i=0;i<RENDERED.length;i++){ await capture(RENDERED[i],i); await new Promise(r=>setTimeout(r,250)); }
  }
  window.exportOne=exportOne; window.exportAll=exportAll;
</script>
</body>
</html>
