# 机构实体归一字典(解决关系图的核心病:同一机构裂成多个节点 + 复合机构吞掉合作边)
# 用法见 pipeline/entities.py。canonical 名 -> 国家 + 别名(跨语言/缩写/带实验室后缀)。
# 匹配:把 org 原始串按分隔符拆成片段,每个片段去噪声后缀后查此表(精确或子串)。

# 整条/片段命中即丢弃的噪声"机构"(无情报量,不建节点)
drop:
  - 未知
  - unknown
  - n/a
  - none
  - 多机构
  - 多家机构
  - 学术联合
  - 国际联盟
  - 联合团队
  - 联合
  - 国际
  - NeurIPS组织委员会
  - NeurIPS 2024组织委员会
  - Nature Medicine团队
  - 多中心

